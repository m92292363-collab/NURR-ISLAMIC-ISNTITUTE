[build]
  publish = "public"

[[redirects]]
  from = "/"
  to = "/.netlify/functions/page?p=main"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/.netlify/functions/page?p=main"
  status = 200
  force = true

[[redirects]]
  from = "/staff-be2m0iebk7/"
  to = "/.netlify/functions/page?p=staff"
  status = 200
  force = true

[[redirects]]
  from = "/staff-be2m0iebk7/index.html"
  to = "/.netlify/functions/page?p=staff"
  status = 200
  force = true

[[redirects]]
  from = "/admin-xo42rqv82v/"
  to = "/.netlify/functions/page?p=admin"
  status = 200
  force = true

[[redirects]]
  from = "/admin-xo42rqv82v/index.html"
  to = "/.netlify/functions/page?p=admin"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
