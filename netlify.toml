# =====================================================================
#  Nurr Islamic Institute — Netlify configuration
#  Saho Digital Services
# =====================================================================
[build]
  publish   = "."
  functions = "netlify/functions"

# Short teacher link:  /t/<key>  ->  staff page
[[redirects]]
  from   = "/t/:k"
  to     = "/staff/?k=:k"
  status = 302
  force  = true

# Browser calls /api/get-all-students  ->  the api function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# Admin panel: keep out of search engines, never allow framing (clickjacking)
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Teacher page: the access key travels in the URL, so never send it as a Referer
[[headers]]
  for = "/staff/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
