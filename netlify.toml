[build]
  publish = "public"

# Each page is served by its own small function (keeps "View Page Source" clean).
[[redirects]]
  from = "/"
  to = "/.netlify/functions/page-main"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/.netlify/functions/page-main"
  status = 200
  force = true

# Teacher page (teachers open their personal ?k= link from the admin)
[[redirects]]
  from = "/staff-be2m0iebk7/"
  to = "/.netlify/functions/page-staff"
  status = 200
  force = true

[[redirects]]
  from = "/staff-be2m0iebk7/index.html"
  to = "/.netlify/functions/page-staff"
  status = 200
  force = true

# Admin desktop app
[[redirects]]
  from = "/admin-xo42rqv82v/"
  to = "/.netlify/functions/page-admin"
  status = 200
  force = true

[[redirects]]
  from = "/admin-xo42rqv82v/index.html"
  to = "/.netlify/functions/page-admin"
  status = 200
  force = true

# Security console (owner only)
[[redirects]]
  from = "/owner-isp1jlo4gt/"
  to = "/.netlify/functions/page-owner"
  status = 200
  force = true

[[redirects]]
  from = "/owner-isp1jlo4gt/index.html"
  to = "/.netlify/functions/page-owner"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
