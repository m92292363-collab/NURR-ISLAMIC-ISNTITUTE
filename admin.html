<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NURR · Admin</title>
<link rel="icon" href="favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d3b6e">
<link rel="apple-touch-icon" href="/app-icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1e6fd9; --blue-dark:#0d3b6e; --blue-soft:#e8f2fe; --blue-mid:#cfe3fa;
  --ink:#14314f; --soft:#5f7a99; --line:#d9e6f5;
  --bg:#eef5fe; --card:#ffffff; --ok:#1e9e5a; --bad:#d64545; --warn:#c9820a; --gold:#e0a800;
  --sidebar:#0d3b6e; --sidebar-2:#15529a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body.rtl{direction:rtl;font-family:'Amiri','Nunito',serif}
a{color:var(--blue)}
input,select,textarea,button{font-family:inherit}
input,select,textarea{width:100%;padding:0.6rem 0.75rem;border:1.5px solid var(--line);border-radius:10px;background:#fbfdff;color:var(--ink);outline:none;font-size:0.92rem}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,111,217,.12)}
label{display:block;font-size:0.8rem;font-weight:700;color:var(--soft);margin:0 0 0.3rem}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:0.6rem 1.1rem;font-weight:800;font-size:0.9rem;cursor:pointer;transition:.15s}
.btn:hover{background:#1a5fba}
.btn.sm{padding:0.4rem 0.8rem;font-size:0.82rem}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--blue-dark)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.bad{background:#fbeaea;color:var(--bad);border:1.5px solid #f3cccc}
.msg{border-radius:10px;padding:0.55rem 0.8rem;font-size:0.86rem;margin-top:0.6rem;display:none}
.msg.show{display:block}
.msg.ok{background:#e7f7ee;color:#157347;border:1px solid #b6e3c8}
.msg.err{background:#fdeaea;color:#b02a2a;border:1px solid #f1c4c4}

/* LOGIN */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;
  background:linear-gradient(150deg,#eaf3ff 0%,#dcebfd 0%,#dbeafe 60%,#eaf3ff 100%)}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2.2rem 2rem;width:100%;max-width:390px;text-align:center;box-shadow:0 18px 50px rgba(13,59,110,.14)}
.login-card .logo{width:72px;height:72px;border-radius:18px;object-fit:contain;background:var(--blue-soft);padding:8px}
.login-card h1{font-size:1.25rem;margin:0.7rem 0 0.2rem;color:var(--blue-dark)}
.login-card p{color:var(--soft);font-size:0.85rem;margin-bottom:1.3rem}
.login-card label{text-align:start;margin-top:0.8rem}

/* APP LAYOUT */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));color:#dbe9fb;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.sb-brand{display:flex;align-items:center;gap:0.6rem;padding:1rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.12)}
.sb-brand img{width:38px;height:38px;border-radius:10px;background:#fff;padding:3px;object-fit:contain}
.sb-brand b{font-size:1rem;color:#fff;line-height:1.1}
.sb-brand span{font-size:0.72rem;color:#9fc0ea}
.sb-scroll{flex:1;overflow-y:auto;padding:0.6rem 0.5rem}
.sb-group{font-size:0.68rem;text-transform:uppercase;letter-spacing:.06em;color:#7ba3d6;padding:0.8rem 0.7rem 0.3rem;font-weight:800}
.sb-item{display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0.75rem;border-radius:10px;color:#cfe0f7;cursor:pointer;font-weight:700;font-size:0.9rem;margin-bottom:2px}
.sb-item i{width:18px;text-align:center;font-size:0.95rem}
.sb-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sb-item.on{background:#fff;color:var(--blue-dark)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0.7rem 1.2rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:20}
.topbar h2{font-size:1.1rem;color:var(--blue-dark);flex:1;display:flex;align-items:center;gap:0.5rem}
.lang-toggle{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang-toggle button{border:0;background:#fff;color:var(--soft);padding:0.3rem 0.8rem;font-weight:800;font-size:0.8rem;cursor:pointer}
.lang-toggle button.on{background:var(--blue);color:#fff}
.content{padding:1.2rem;max-width:1180px;width:100%;margin:0 auto}
.page{display:none;animation:fade .2s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.2rem;margin-bottom:1.1rem;box-shadow:0 2px 10px rgba(13,59,110,.04)}
.card h3{font-size:1rem;color:var(--blue-dark);margin-bottom:0.9rem;display:flex;align-items:center;gap:0.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0.8rem}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0.9rem;margin-bottom:1.1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 2px 10px rgba(13,59,110,.05);position:relative;overflow:hidden}
.stat .ico{position:absolute;inset-inline-end:0.8rem;top:0.8rem;width:38px;height:38px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.stat .n{font-size:1.9rem;font-weight:800;color:var(--blue-dark)}
.stat .l{color:var(--soft);font-size:0.82rem;font-weight:700}
.stat.green .ico{background:#e4f6ec;color:var(--ok)} .stat.gold .ico{background:#fdf3d8;color:var(--gold)} .stat.red .ico{background:#fbe9e9;color:var(--bad)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:0.86rem}
th,td{padding:0.55rem 0.7rem;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--blue-soft);color:var(--blue-dark);font-size:0.74rem;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
tr:hover td{background:#f6faff}
.badge{display:inline-block;padding:0.12rem 0.55rem;border-radius:999px;font-size:0.72rem;font-weight:800}
.b-green{background:#e4f6ec;color:#157347}.b-red{background:#fbe9e9;color:#b02a2a}.b-gray{background:#eef2f7;color:#5f7a99}.b-gold{background:#fdf3d8;color:#9a7700}
.empty{text-align:center;color:var(--soft);padding:2rem 1rem}
.empty i{font-size:1.8rem;color:var(--blue-mid);display:block;margin-bottom:0.5rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.row-actions{display:flex;gap:0.3rem;flex-wrap:wrap}
.filters{display:flex;gap:0.6rem;flex-wrap:wrap;align-items:end;margin-bottom:0.9rem}
.filters>div{flex:1;min-width:130px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,#eef3f9,#dde8f4,#eef3f9);background-size:200% 100%;animation:sh 1.2s infinite;margin:0.5rem 0}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

.install-bar{display:flex;align-items:center;gap:1rem;margin:0 0 1.1rem;padding:0.9rem 1.1rem;background:#fff;border:1.5px solid var(--blue-mid);border-radius:14px;box-shadow:0 4px 16px rgba(13,59,110,.06)}
.install-bar img{width:46px;height:46px;border-radius:11px;flex-shrink:0}
.install-bar .ib-t{flex:1;min-width:0}.install-bar .ib-t b{display:block;color:var(--blue-dark);font-size:0.95rem}.install-bar .ib-t span{color:var(--soft);font-size:0.82rem}
.install-bar .ib-x{background:none;border:0;color:#9db2c9;font-size:1.3rem;cursor:pointer;padding:0.2rem 0.4rem;line-height:1}
@media(max-width:860px){.install-bar{display:none!important}}
.fo-chip{border:1.5px solid var(--line);background:#fff;color:var(--soft);padding:0.35rem 0.8rem;border-radius:999px;font-weight:700;font-size:0.82rem;cursor:pointer}.fo-chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}.fo-chip b{font-weight:800}
/* mobile sidebar */
.menu-btn{display:none;background:none;border:0;font-size:1.3rem;color:var(--blue-dark);cursor:pointer}
.backdrop{display:none;position:fixed;inset:0;background:rgba(13,42,74,.45);z-index:40}
@media(max-width:860px){
  .sidebar{position:fixed;inset-inline-start:0;top:0;z-index:50;transform:translateX(-100%);transition:.25s}
  body.rtl .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:none}
  .menu-btn{display:block}
  .backdrop.show{display:block}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <img src="nurry.png" class="logo" alt="" onerror="this.style.display='none'">
    <h1 data-t="brand">Nurr Islamic Institute</h1>
    <p data-t="adminPanel">Administration Panel</p>
    <label data-t="username">Username</label>
    <input type="text" id="lu" autocomplete="username" autocapitalize="none">
    <label data-t="password">Password</label>
    <input type="password" id="lp" autocomplete="current-password">
    <button class="btn" style="width:100%;margin-top:1.1rem" id="loginBtn" onclick="doLogin()"><i class="fas fa-right-to-bracket"></i> <span data-t="login">Log in</span></button>
    <div class="msg err" id="loginErr"></div>
    <div style="margin-top:1rem"><button class="lang-flip" onclick="toggleLang()" style="background:none;border:0;color:var(--blue);font-weight:800;cursor:pointer" id="langFlipLogin">عربي</button></div>
  </div>
</div>

<!-- APP -->
<div id="app">
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><img src="nurry.png" alt="" onerror="this.style.display='none'"><div><b data-t="nurr">NURR</b><br><span data-t="adminPanel">Admin Panel</span></div></div>
    <div class="sb-scroll" id="sbNav"></div>
  </aside>
  <div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="openSidebar()"><i class="fas fa-bars"></i></button>
      <h2><i class="fas fa-gauge-high"></i> <span id="pageTitle">Dashboard</span></h2>
      <div class="lang-toggle"><button id="enBtn" class="on" onclick="setLang('en')">EN</button><button id="arBtn" onclick="setLang('ar')">عربي</button></div>
      <button class="btn ghost sm" onclick="logout()"><i class="fas fa-right-from-bracket"></i> <span data-t="logout">Log out</span></button>
    </div>
    <div class="content"><div class="install-bar" id="installBar" style="display:none">
      <img src="/app-icons/icon-192.png" alt="NURR">
      <div class="ib-t"><b data-t="installTitle">Install NURR on this computer</b><span data-t="installSub">Open the admin from your desktop in one click — no browser tabs.</span></div>
      <button class="btn" onclick="installApp()"><i class="fas fa-download"></i> <span data-t="installBtn">Install NURR</span></button>
      <button class="ib-x" onclick="hideInstallBar()" title="Hide">&times;</button>
    </div><div id="content"></div></div>
  </div>
</div>
</div>

/* ============ API ============ */
var API='/api/';
function tok(){ return sessionStorage.getItem('nurr_token'); }
async function api(action, opts){
  opts=opts||{};
  var qs = opts.params ? ('?'+new URLSearchParams(Object.keys(opts.params).reduce(function(o,k){ if(opts.params[k]!=null&&opts.params[k]!=='') o[k]=opts.params[k]; return o;},{}))) : '';
  var init={ method:opts.method||'GET', headers:{} };
  if(tok()) init.headers['Authorization']='Bearer '+tok();
  if(opts.body){ init.headers['Content-Type']='application/json'; init.body=JSON.stringify(opts.body); }
  var res=await fetch(API+action+qs, init);
  if(res.status===401 && action!=='admin-login'){ sessionStorage.clear(); alert(t('sessionExpired')); location.reload(); throw new Error('401'); }
  var data; try{ data=await res.json(); }catch(e){ throw new Error('bad response'); }
  if(!data.success) throw new Error(data.error||'error');
  return data;
}

      var ad=await api('get-attendance',{params:{date:date,gradeLevel:grade,className:cls}});
      var rec=ad.record||{};

      body.innerHTML='<div class="stat-cards"><div class="stat green"><div class="n">'+P+'</div><div class="l">'+t('present')+'</div></div><div class="stat red"><div class="n">'+Ab+'</div><div class="l">'+t('absent')+'</div></div></div>'+

        list.map(function(s){ var st=rec[s.student_id]; var badge = st==='absent'?'<span class="badge b-red">'+t('absent')+'</span>':(st?'<span class="badge b-green">'+t('present')+'</span>':'<span class="badge b-gray">—</span>');
          return '<tr><td>'+esc(s.student_id)+'</td><td>'+esc(s.full_name)+'</td><td>'+badge+'</td></tr>'; }).join('')+'</tbody></table></div>';
    }catch(e){ body.innerHTML=errBox('attendance','loadAtt'); }
  };
}

function showReceipt(r){

    '<div class="rcpt-head"><img src="'+origin+'/favicon.png" onerror="this.style.display=\'none\'"><div><div class="rcpt-school">معهد النور الإسلامي · NURR ISLAMIC INSTITUTE</div><div class="rcpt-sub">MDI Road Kanifing · The Gambia</div></div></div>'+

    '<div class="rcpt-no">'+t('receipt')+' #'+e(r.receiptNumber)+' · '+e(paid)+'</div>'+
    '<table class="rcpt-tbl">'+
      '<tr><td>'+t('name')+'</td><td>'+e(r.studentName)+'</td></tr>'+
      '<tr><td>'+t('studentId')+'</td><td>'+e(r.studentId)+'</td></tr>'+
      '<tr><td>'+t('grade')+'</td><td>'+e(r.stage||'')+' / '+e(r.className||'')+'</td></tr>'+

      '<tr><td>'+t('academicYear')+'</td><td>'+e(r.academicYear)+' · '+e(r.term)+'</td></tr>'+
      '<tr><td>'+t('method')+'</td><td>'+e(r.period||r.method||'')+'</td></tr>'+
      (r.reference?'<tr><td>'+t('reference')+'</td><td>'+e(r.reference)+'</td></tr>':'')+
      '<tr class="rcpt-amt"><td>'+t('amountField')+'</td><td>'+money(r.amount)+'</td></tr>'+
    '</table>'+
    '<div class="rcpt-sign">…………………………<br>'+t('cashier')+'</div></div>';
  var m=document.getElementById('rcptModal');
  if(!m){ m=document.createElement('div'); m.id='rcptModal'; m.style.cssText='position:fixed;inset:0;background:rgba(13,42,74,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem'; document.body.appendChild(m); }
  m.innerHTML='<div style="background:#fff;border-radius:16px;max-width:460px;width:98%;max-height:94vh;display:flex;flex-direction:column"><div style="padding:0.8rem 1rem;border-bottom:1px solid var(--line);display:flex;gap:0.5rem;align-items:center"><b style="color:var(--blue-dark)"><i class="fas fa-receipt"></i> '+t('receipt')+'</b><button class="btn sm" style="margin-inline-start:auto" onclick="printReceipt()"><i class="fas fa-print"></i> '+t('print')+'</button><button class="btn ghost sm" onclick="document.getElementById(\'rcptModal\').remove()">✕</button></div><div style="overflow:auto;padding:1rem;background:#e9eef5;text-align:center"><div id="rcptHost"></div></div></div>';
  injectRcptCSS(); document.getElementById('rcptHost').innerHTML=sheet;
}
function injectRcptCSS(){
  if(document.getElementById('rcptStyle'))return; var st=document.createElement('style'); st.id='rcptStyle';
  st.textContent=".rcpt{background:#fff;color:#000;width:90mm;padding:8mm 7mm;box-sizing:border-box;font-family:'Amiri','Times New Roman',serif;text-align:right;display:inline-block;box-shadow:0 4px 20px rgba(0,0,0,.2)}"+
    ".rcpt-head{display:flex;align-items:center;gap:8px;border-bottom:2pt solid #0d3b6e;padding-bottom:6px}.rcpt-head img{width:42px;height:42px;object-fit:contain}.rcpt-school{font-size:11pt;font-weight:bold;line-height:1.1}.rcpt-sub{font-size:7.5pt;color:#444}"+
    ".rcpt-title{text-align:center;font-size:12pt;font-weight:bold;letter-spacing:2px;margin:8px 0 2px}.rcpt-no{text-align:center;font-size:8.5pt;color:#333;margin-bottom:8px}"+
    ".rcpt-tbl{width:100%;border-collapse:collapse;font-size:9.5pt}.rcpt-tbl td{border:0.5pt solid #bbb;padding:4px 6px}.rcpt-tbl td:first-child{font-weight:bold;background:#f4f6f9;width:42%}.rcpt-amt td{font-weight:bold;font-size:11pt;background:#eef7ff}"+
    ".rcpt-sign{margin-top:16px;text-align:center;font-size:9pt}";
  document.head.appendChild(st);
}
function printReceipt(){
  var sheet=document.getElementById('rcptSheet'); if(!sheet)return; var css=document.getElementById('rcptStyle').textContent;
  var win=window.open('','_blank'); if(!win)return;

}

var _lastLink='';
async function loadLinks(){
  try{ var d=await api('staff-links'); var rows=d.links||[];
    document.getElementById('lkBody').innerHTML = rows.length? '<div class="tbl-wrap"><table><thead><tr><th>'+t('teachers')+'</th><th>'+t('created')+'</th><th>'+t('validUntil')+'</th><th>'+t('lastUsed')+'</th><th>'+t('status')+'</th><th></th></tr></thead><tbody>'+
      rows.map(function(l){ var st=l.revoked?'<span class="badge b-red">'+t('linkCancelled')+'</span>':l.not_expired?'<span class="badge b-green">'+t('linkActive')+'</span>':'<span class="badge b-gray">'+t('linkExpired')+'</span>';
        return '<tr><td><b>'+esc(l.full_name)+'</b></td><td>'+esc(l.created||'')+'</td><td>'+esc(l.expires||'')+'</td><td>'+esc(l.last_used||t('notUsed'))+'</td><td>'+st+'</td><td>'+(!l.revoked&&l.not_expired?'<button class="btn bad sm" onclick="revokeLink('+l.id+')">'+t('cancelLink')+'</button>':'')+'</td></tr>'; }).join('')+'</tbody></table></div>' : emptyBox();
  }catch(e){ document.getElementById('lkBody').innerHTML=errBox('links','loadLinks'); }
}
async function createLink(){
  hide('lk-ok','lk-err');
  var teacherId=val('lk-teacher'), until=val('lk-until');
  if(!teacherId||!until){ show('lk-err',t('required')); return; }
  var btn=document.getElementById('lkBtn'); btn.disabled=true;
  try{ var d=await api('create-staff-link',{method:'POST',body:{teacherId:parseInt(teacherId),validUntil:until}});
    _lastLink=location.origin+'/staff/?k='+encodeURIComponent(d.key);
    document.getElementById('lk-url').textContent=_lastLink;
    document.getElementById('lk-wa').href='https://wa.me/?text='+encodeURIComponent('NURR teacher link (valid until '+until+'):\n'+_lastLink+'\nUsername: '+(d.username||'')+'\nDo not share this link.');
    document.getElementById('lk-result').style.display=''; show('lk-ok','✅ '+t('created')); loadLinks();
  }catch(e){ show('lk-err','❌ '+e.message); }
  btn.disabled=false;
}
function copyLink(){ if(!_lastLink) return; if(navigator.clipboard) navigator.clipboard.writeText(_lastLink); show('lk-ok','✅ '+t('copy')); }
async function revokeLink(id){ if(!confirm(t('confirm'))) return; try{ await api('revoke-staff-link',{method:'POST',body:{id:id}}); loadLinks(); }catch(e){ alert(e.message); } }

/* ======================= small helpers ======================= */
function field(id,label,type,value){ return '<div><label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'"'+(value!=null?' value="'+esc(value)+'"':'')+'></div>'; }
function selField(id,label){ return '<div><label>'+label+'</label><select id="'+id+'"></select></div>'; }
function val(id){ var e=document.getElementById(id); return e?e.value.trim():''; }
function show(id,msg){ var e=document.getElementById(id); if(e){ e.textContent=msg; e.classList.add('show'); } }
function hide(){ for(var i=0;i<arguments.length;i++){ var e=document.getElementById(arguments[i]); if(e) e.classList.remove('show'); } }
var _gradeStages=null;

      '<div><label>'+t('showTop')+'</label><select id="tp-limit"><option>10</option><option selected>20</option><option>50</option></select></div>'+

async function loadTop(){
  var body=document.getElementById('tpBody'); body.innerHTML=skeleton();
  var year=val('tp-year'), term=val('tp-term'), grade=val('tp-grade'), limit=parseInt(val('tp-limit'))||20;
  try{
    var p=[]; if(year)p.push('academicYear='+encodeURIComponent(year)); if(term)p.push('term='+encodeURIComponent(term)); if(grade)p.push('gradeLevel='+encodeURIComponent(grade));
    var res=await fetch('/api/get-all-results'+(p.length?'?'+p.join('&'):''),{headers:{'Authorization':'Bearer '+tok()}}); var d=await res.json();
    if(!d.success) throw new Error(d.error);
    var by={}; (d.results||[]).forEach(function(r){ if(!by[r.student_id]) by[r.student_id]={name:r.full_name,grade:r.grade_level,total:0,count:0}; by[r.student_id].total+=Number(r.score||0); by[r.student_id].count++; });
    var sorted=Object.keys(by).map(function(id){return [id,by[id]];}).sort(function(a,b){return b[1].total-a[1].total;}).slice(0,limit);
    if(!sorted.length){ body.innerHTML=emptyBox(); return; }
    body.innerHTML='<div class="tbl-wrap"><table><thead><tr><th>#</th><th>'+t('studentId')+'</th><th>'+t('name')+'</th><th>'+t('grade')+'</th><th>'+t('total')+'</th><th>'+t('average')+'</th></tr></thead><tbody>'+
      sorted.map(function(e,i){ var s=e[1]; var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1); return '<tr><td>'+medal+'</td><td>'+esc(e[0])+'</td><td><b>'+esc(s.name)+'</b></td><td>'+esc(s.grade||'')+'</td><td>'+s.total+'</td><td>'+(s.total/s.count).toFixed(1)+'%</td></tr>'; }).join('')+'</tbody></table></div>';
  }catch(e){ body.innerHTML=errBox('topStudents','loadTop'); }
}

async function buildReport(){
  hide('vr-err');
  var sid=val('vr-student'), year=val('vr-year'), term=val('vr-term');
  if(!sid){ show('vr-err',t('required')); return; }
  try{
    var rc=await api('get-report-card',{params:{studentId:sid,academicYear:year}});
    var all=await (await fetch('/api/get-all-results?academicYear='+encodeURIComponent(year)+'&term='+encodeURIComponent(term),{headers:{'Authorization':'Bearer '+tok()}})).json();
    var rem=await api('get-remarks',{params:{studentId:sid,academicYear:year,term:term}}).catch(function(){return {remarks:null};});
    renderReportCard(rc.student, (rc.results||[]).filter(function(r){return r.term===term;}), all.results||[], rem.remarks, year, term);
    document.getElementById('vr-sheet-wrap').style.display='';
    scaleSheet('rcSheet','rcCanvas');
  }catch(e){ show('vr-err','❌ '+e.message); }
}
function renderReportCard(stu, myResults, allResults, remarks, year, term){
  var e=esc, origin=location.origin;
  // compute totals + position in class
  var subj=myResults.map(function(r){ return {subject:r.subject, score:Number(r.score), grade:r.grade}; });
  var total=subj.reduce(function(a,r){return a+(r.score||0);},0);
  var avg=subj.length?(total/subj.length):0;
  // position: among same class, sum totals
  var byStu={}; allResults.forEach(function(r){ if(String(r.class_name)!==String(stu.class_name))return; if(!byStu[r.student_id])byStu[r.student_id]=0; byStu[r.student_id]+=Number(r.score||0); });
  var totals=Object.keys(byStu).map(function(k){return byStu[k];}).sort(function(a,b){return b-a;});
  var pos=totals.indexOf(total)+1; var classSize=totals.length;
  var r=remarks||{};
  var rows=subj.map(function(x){ return '<tr><td class="s">'+e(x.subject)+'</td><td>'+(x.score!=null?e(x.score):'')+'</td><td>'+e(x.grade||'')+'</td></tr>'; }).join('');
  var sheet='<div id="rcSheet" class="rc">'+
    '<div class="rc-head"><img src="'+origin+'/favicon.png" onerror="this.style.display=\'none\'"><div><div class="rc-school">معهد النور الإسلامي · NURR ISLAMIC INSTITUTE</div><div class="rc-sub">MDI Road Kanifing · The Gambia</div></div></div>'+
    '<div class="rc-title">كشف الدرجات · REPORT CARD</div>'+
    '<div class="rc-info"><span><b>'+t('name')+':</b> '+e(stu.full_name)+'</span><span><b>'+t('studentId')+':</b> '+e(stu.student_id)+'</span><span><b>'+t('grade')+':</b> '+e(stu.grade_level||'')+' / '+e(stu.class_name||'')+'</span><span><b>'+t('term')+':</b> '+e(term)+' · '+e(year)+'</span></div>'+
    '<table class="rc-table"><thead><tr><th>'+t('subject')+'</th><th>'+t('score')+'</th><th>'+t('gradeCol')+'</th></tr></thead><tbody>'+rows+
      '<tr class="rc-total"><td>'+t('total')+'</td><td>'+total+'</td><td>'+avg.toFixed(1)+'%</td></tr></tbody></table>'+
    '<div class="rc-pos"><span><b>'+t('position')+':</b> '+(pos||'-')+' / '+(classSize||'-')+'</span><span><b>'+t('conduct')+':</b> '+e(r.conduct||'')+'</span></div>'+
    '<div class="rc-remark"><b>'+t('teacherRemark')+':</b> '+e(r.teacher_remark||'……………')+'</div>'+
    '<div class="rc-remark"><b>'+t('headRemark')+':</b> '+e(r.head_remark||'……………')+'</div>'+
    (r.next_term_date?'<div class="rc-remark"><b>'+t('nextTermDate')+':</b> '+e(r.next_term_date)+'</div>':'')+
    '<div class="rc-sign">…………………………<br>'+t('principal')+'</div>'+
  '</div>';
  document.getElementById('rcBody').innerHTML=sheet;
  injectReportCSS();
}
function injectReportCSS(){
  if(document.getElementById('rcStyle')) return;
  var st=document.createElement('style'); st.id='rcStyle';
  st.textContent=".rc{background:#fff;color:#000;width:210mm;min-height:148mm;padding:12mm;box-sizing:border-box;font-family:'Amiri','Times New Roman',serif;transform-origin:top center;display:inline-block;text-align:right;box-shadow:0 4px 24px rgba(0,0,0,.2)}"+
    ".rc-head{display:flex;align-items:center;gap:12px;border-bottom:2.5pt solid #0d3b6e;padding-bottom:8px}.rc-head img{width:60px;height:60px;object-fit:contain}.rc-school{font-size:15pt;font-weight:bold}.rc-sub{font-size:9pt;color:#444}"+
    ".rc-title{text-align:center;font-size:16pt;font-weight:bold;letter-spacing:4px;margin:12px 0}"+
    ".rc-info{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:10.5pt;border:1pt solid #000;padding:8px;margin-bottom:10px}"+
    ".rc-table{width:100%;border-collapse:collapse;border:1.5pt solid #000;font-size:10pt}.rc-table th,.rc-table td{border:1pt solid #000;padding:5px 6px;text-align:center}.rc-table th{background:#eef2f7;font-weight:bold}.rc-table td.s{text-align:right;font-weight:600}.rc-total td{font-weight:bold;background:#f4f9ff}"+
    ".rc-pos{display:flex;justify-content:space-between;margin-top:10px;font-size:10.5pt}.rc-remark{margin-top:8px;font-size:10.5pt}.rc-sign{margin-top:22px;font-size:10.5pt;text-align:center}";
  document.head.appendChild(st);
}

/* shared print + scale */
function scaleSheet(sheetId,canvasId){
  requestAnimationFrame(function(){ var canvas=document.getElementById(canvasId), sheet=document.getElementById(sheetId); if(!canvas||!sheet)return; sheet.style.transform='scale(1)'; requestAnimationFrame(function(){ var w=canvas.clientWidth-32, sw=sheet.offsetWidth; if(sw<=0)return; var sc=Math.min(1,w/sw); sheet.style.transform='scale('+sc+')'; sheet.style.marginBottom='-'+Math.max(0,sheet.offsetHeight*(1-sc)-16)+'px'; }); });
}
function printSheet(sheetId){
  var sheet=document.getElementById(sheetId); if(!sheet)return;
  var prev=sheet.style.transform, pm=sheet.style.marginBottom; sheet.style.transform='scale(1)'; sheet.style.marginBottom='0';
  var html=sheet.outerHTML; sheet.style.transform=prev; sheet.style.marginBottom=pm;
  var css=document.getElementById('rcStyle')?document.getElementById('rcStyle').textContent:'';
  var win=window.open('','_blank'); if(!win){ alert('Allow popups to print'); return; }
  win.document.write('<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>Print</title><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet"><style>'+css+'@page{size:A4 portrait;margin:8mm}body{margin:0}#'+sheetId+'{transform:none!important;margin:0 auto!important;box-shadow:none!important}</style></head><body>'+html+'<'+'script>window.onload=function(){window.print()}<'+'/script></body></html>');
  win.document.close();
}

    '<div class="filters">'+

      '<div><label>'+t('className')+'</label><input id="pb-class"></div>'+

      '<div><label>'+t('term')+'</label><select id="pb-term"><option>Term 1</option><option>Term 2</option></select></div>'+
      '<div style="flex:0"><label>&nbsp;</label><button class="btn" onclick="buildBroadsheet()"><i class="fas fa-table"></i> '+t('view')+'</button></div>'+
    '</div><div class="msg err" id="pb-err"></div><div id="pb-out" style="margin-top:1rem"></div></div>';

async function buildBroadsheet(){
  hide('pb-err');
  var grade=val('pb-grade'), cls=val('pb-class'), year=val('pb-year'), term=val('pb-term');
  if(!grade||!cls){ show('pb-err',t('required')); return; }
  document.getElementById('pb-out').innerHTML=skeleton();
  try{
    var p=['academicYear='+encodeURIComponent(year),'term='+encodeURIComponent(term),'gradeLevel='+encodeURIComponent(grade)];
    var res=await fetch('/api/get-all-results?'+p.join('&'),{headers:{'Authorization':'Bearer '+tok()}}); var d=await res.json();
    var rows=(d.results||[]).filter(function(r){ return String(r.class_name).toLowerCase()===cls.toLowerCase(); });
    if(!rows.length){ document.getElementById('pb-out').innerHTML=emptyBox(); return; }
    var subjects=[]; rows.forEach(function(r){ if(subjects.indexOf(r.subject)<0)subjects.push(r.subject); });

function openTranscript(){
  if(!_histData){ alert(t('studentNotFound')); return; }
  var d=_histData, s=d.student, e=esc, origin=location.origin;
  var present={}; d.results.forEach(function(r){present[r.subject]=1;});
  var subjects=Object.keys(present);
  if(!subjects.length){ alert(t('noData')); return; }
  // years with records
  var years=d.years.slice().sort();
  var TERMS=['Term 1','Term 2'];
  function cell(subj,year,term){ var r=d.results.find(function(x){return x.subject===subj&&x.academic_year===year&&x.term===term;}); return r?{score:r.score,grade:r.grade||''}:{score:'',grade:''}; }

  var termCols=years.map(function(){return '<th>T1</th><th>GR</th><th>T2</th><th>GR</th>';}).join('');
  var body=subjects.map(function(subj){
    var tds=''; years.forEach(function(y){ TERMS.forEach(function(tm){ var cc=cell(subj,y,tm); tds+='<td>'+(cc.score===''?'':e(cc.score))+'</td><td>'+(cc.grade?e(cc.grade):'')+'</td>'; }); });

    '<table class="tx-table"><thead><tr><th rowspan="2">'+t('subject')+'</th>'+groupCols+'</tr><tr>'+termCols+'</tr></thead><tbody>'+body+'</tbody></table>'+

  injectTxCSS(); document.getElementById('txHost').innerHTML=sheet;

async function saveTarget(){
  hide('ft-ok','ft-err');
  var b={ className:val('ft-class'), academicYear:val('ft-year'), instituteAmount:parseFloat(val('ft-institute'))||0, examAmount:parseFloat(val('ft-exam'))||0 };
  if(!b.className||!b.academicYear){ show('ft-err',t('required')); return; }
  try{ await api('set-fee-target',{method:'POST',body:b}); show('ft-ok','✅ '+t('saved')); loadTargets(); }
  catch(e){ show('ft-err','❌ '+e.message); }
}

/* ======================= PAYMENT HISTORY (all payments, reprint, delete) ======================= */
async function pagePayments(c){
  c.innerHTML='<div class="card"><h3><i class="fas fa-receipt"></i> '+t('paymentHistory')+' <button class="btn ghost sm" style="margin-inline-start:auto" onclick="loadPayments()"><i class="fas fa-rotate"></i> '+t('refresh')+'</button></h3>'+
    '<div class="filters"><div><label>'+t('search')+'</label><input id="py-search" placeholder="'+t('name')+' / '+t('studentId')+' / '+t('receipt')+'"></div></div>'+
    '<div id="pyBody">'+skeleton()+'</div></div>';
  loadPayments();
}
var _payments=[];
async function loadPayments(){
  var body=document.getElementById('pyBody'); if(!_payments.length) body.innerHTML=skeleton();
  try{ var d=await api('get-all-fee-payments'); _payments=d.payments||[]; renderPayments(_payments);
    var si=document.getElementById('py-search'); si.oninput=function(){ var q=this.value.toLowerCase().trim(); renderPayments(!q?_payments:_payments.filter(function(p){ return (p.full_name||'').toLowerCase().indexOf(q)>=0 || (p.student_id||'').toLowerCase().indexOf(q)>=0 || String(p.receipt_number||'').indexOf(q)>=0; })); };
  }catch(e){ body.innerHTML=errBox('paymentHistory','loadPayments'); }
}
function renderPayments(list){
  var body=document.getElementById('pyBody');
  if(!list.length){ body.innerHTML=emptyBox(); return; }
  var total=list.reduce(function(a,p){return a+Number(p.amount||0);},0);
  body.innerHTML='<div class="stat-cards" style="margin-bottom:0.8rem"><div class="stat green"><div class="n">'+money(total)+'</div><div class="l">'+t('totalCollected')+'</div></div><div class="stat"><div class="n">'+list.length+'</div><div class="l">'+t('payments')+'</div></div></div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>'+t('receipt')+'</th><th>'+t('date')+'</th><th>'+t('name')+'</th><th>'+t('grade')+'</th><th>'+t('academicYear')+'</th><th>'+t('amountField')+'</th><th>'+t('method')+'</th><th>'+t('actions')+'</th></tr></thead><tbody>'+
    list.map(function(p){ var dt=p.paid_at?new Date(p.paid_at).toLocaleDateString('en-GB'):''; return '<tr><td>#'+esc(p.receipt_number||'')+'</td><td>'+esc(dt)+'</td><td>'+esc(p.full_name||'')+'<div style="font-size:0.72rem;color:var(--soft)">'+esc(p.student_id)+'</div></td><td>'+esc((p.grade_level||'')+' / '+(p.class_name||''))+'</td><td>'+esc(p.academic_year)+' · '+esc(p.term)+'</td><td><b>'+money(p.amount)+'</b></td><td>'+esc(p.method||'')+'</td>'+
      '<td class="row-actions"><button class="btn ghost sm" onclick="reprint('+p.id+')"><i class="fas fa-print"></i></button><button class="btn bad sm" onclick="delPayment('+p.id+')"><i class="fas fa-trash"></i></button></td></tr>'; }).join('')+'</tbody></table></div>';
}
async function reprint(id){
  try{ var d=await api('get-receipt',{params:{id:id}}); if(d.receipt) showReceipt(d.receipt); }
  catch(e){ alert('❌ '+e.message); }
}
async function delPayment(id){
  if(!confirm(t('confirmDeletePayment'))) return;
  try{ await api('delete-payment',{method:'DELETE',body:{id:id}}); _payments=[]; loadPayments(); }
  catch(e){ alert('❌ '+e.message); }
}


function money(n){ n=Number(n)||0; return "D "+n.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2}); }
/* ======================= FEES OVERVIEW (full, like original) ======================= */
var _feeSummary=[], _feePayments=[];
async function pageFees(c){
  var yr=new Date().getFullYear();
  c.innerHTML='<div class="card"><h3><i class="fas fa-sack-dollar"></i> '+t('fees')+'</h3>'+
    '<div class="filters"><div><label>'+t('academicYear')+'</label><input id="fo-year" value="'+yr+'-'+(yr+1)+'"></div>'+
    '<div><label>'+t('term')+'</label><select id="fo-term"><option>Term 1</option><option>Term 2</option></select></div>'+
    '<div style="flex:0"><label>&nbsp;</label><button class="btn" onclick="loadFeesOverview()"><i class="fas fa-magnifying-glass"></i></button></div></div></div>'+
    '<div id="fo-body"><div class="card"><div class="empty"><i class="fas fa-sack-dollar"></i>'+t('pickFilters')+'</div></div></div>';
  window.loadFeesOverview=loadFeesOverview;
}
async function loadFeesOverview(){
  var year=val('fo-year'), term=val('fo-term'), body=document.getElementById('fo-body');
  body.innerHTML='<div class="card">'+skeleton()+'</div>';
  try{
    var sum=await api('get-fee-summary',{params:{academicYear:year,term:term}});
    _feeSummary=sum.summary||[];
    var pays=await api('get-all-fee-payments').catch(function(){return {payments:[]};});
    _feePayments=(pays.payments||[]).filter(function(p){ return (!year||p.academic_year===year)&&(!term||p.term===term); });
    renderFeesOverview(year,term);
  }catch(e){ body.innerHTML='<div class="card">'+errBox('fees','loadFeesOverview')+'</div>'; }
}
function feeStatus(r){ var paid=Number(r.paid)||0, exp=Number(r.expected)||0; if(exp<=0) return paid>0?'paid':'none'; if(paid>=exp) return 'paid'; if(paid>0) return 'partial'; return 'unpaid'; }
function renderFeesOverview(year,term){
  var body=document.getElementById('fo-body');
  var rows=_feeSummary;
  if(!rows.length){ body.innerHTML='<div class="card">'+emptyBox()+'</div>'; return; }
  var totExp=0,totPaid=0; rows.forEach(function(r){ totExp+=Number(r.expected)||0; totPaid+=Number(r.paid)||0; });
  var counts={paid:0,partial:0,unpaid:0}; rows.forEach(function(r){ var s=feeStatus(r); if(counts[s]!=null)counts[s]++; });
  // by class totals (paid)
  var byClass={}; rows.forEach(function(r){ var k=(r.grade_level||'')+' / '+(r.class_name||''); if(!byClass[k])byClass[k]={paid:0,exp:0}; byClass[k].paid+=Number(r.paid)||0; byClass[k].exp+=Number(r.expected)||0; });
  var maxPaid=Math.max.apply(null,[1].concat(Object.keys(byClass).map(function(k){return byClass[k].paid;})));

  var html=
    // totals
    '<div class="stat-cards">'+
      '<div class="stat"><div class="n">'+money(totExp)+'</div><div class="l">'+t('expectedTotal')+'</div></div>'+
      '<div class="stat green"><div class="n">'+money(totPaid)+'</div><div class="l">'+t('collectedTotal')+'</div></div>'+
      '<div class="stat red"><div class="n">'+money(totExp-totPaid)+'</div><div class="l">'+t('outstanding')+'</div></div>'+
      '<div class="stat gold"><div class="n">'+rows.length+'</div><div class="l">'+t('totalStudents')+'</div></div>'+
    '</div>'+
    // filter chips
    '<div class="card"><div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.8rem" id="foChips">'+
      chip('all',t('all'),rows.length)+chip('paid',t('paidInFull'),counts.paid)+chip('partial',t('partial'),counts.partial)+chip('unpaid',t('unpaid'),counts.unpaid)+
      '<input id="fo-search" placeholder="'+t('search')+'…" style="flex:1;min-width:160px;margin-inline-start:auto">'+
      '<button class="btn ghost sm" onclick="exportFeesCsv()"><i class="fas fa-file-csv"></i> '+t('exportCsv')+'</button>'+
    '</div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>'+t('studentId')+'</th><th>'+t('name')+'</th><th>'+t('grade')+'</th><th>'+t('expected')+'</th><th>'+t('paid')+'</th><th>'+t('balance')+'</th><th>'+t('status')+'</th></tr></thead><tbody id="foRows"></tbody></table></div></div>'+
    // by class bars
    '<div class="card"><h3><i class="fas fa-chart-bar"></i> '+t('feesByClass')+'</h3>'+
      Object.keys(byClass).sort().map(function(k){ var pct=Math.round(byClass[k].paid/maxPaid*100); return '<div style="margin-bottom:0.5rem"><div style="display:flex;justify-content:space-between;font-size:0.84rem"><span>'+esc(k)+'</span><span><b>'+money(byClass[k].paid)+'</b> / '+money(byClass[k].exp)+'</span></div><div style="height:10px;background:#eef2f7;border-radius:6px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#1e9e5a,#1e6fd9)"></div></div></div>'; }).join('')+
    '</div>'+
    // full ledger
    '<div class="card"><h3><i class="fas fa-book"></i> '+t('paymentLedger')+' <button class="btn ghost sm" style="margin-inline-start:auto" onclick="exportLedgerCsv()"><i class="fas fa-file-csv"></i> '+t('exportCsv')+'</button></h3>'+
      '<div class="tbl-wrap"><table><thead><tr><th>'+t('receipt')+'</th><th>'+t('date')+'</th><th>'+t('name')+'</th><th>'+t('grade')+'</th><th>'+t('amountField')+'</th><th>'+t('method')+'</th><th>'+t('actions')+'</th></tr></thead><tbody>'+
      (_feePayments.length? _feePayments.map(function(p){ var dt=p.paid_at?new Date(p.paid_at).toLocaleDateString('en-GB'):''; return '<tr><td>#'+esc(p.receipt_number||'')+'</td><td>'+esc(dt)+'</td><td>'+esc(p.full_name||'')+'<div style="font-size:0.72rem;color:var(--soft)">'+esc(p.student_id)+'</div></td><td>'+esc((p.grade_level||'')+' / '+(p.class_name||''))+'</td><td><b>'+money(p.amount)+'</b></td><td>'+esc(p.method||'')+'</td><td class="row-actions"><button class="btn ghost sm" onclick="reprint('+p.id+')"><i class="fas fa-print"></i></button><button class="btn bad sm" onclick="delPaymentFO('+p.id+')"><i class="fas fa-trash"></i></button></td></tr>'; }).join('') : '<tr><td colspan="7">'+emptyBox()+'</td></tr>')+
      '</tbody></table></div></div>';
  body.innerHTML=html;
  window._foFilter='all';
  renderFeeRows();
  document.getElementById('fo-search').oninput=renderFeeRows;
  document.querySelectorAll('#foChips [data-chip]').forEach(function(ch){ ch.onclick=function(){ window._foFilter=ch.dataset.chip; document.querySelectorAll('#foChips [data-chip]').forEach(function(x){x.classList.toggle('on',x===ch);}); renderFeeRows(); }; });
}
function chip(id,label,n){ return '<button class="fo-chip'+(id==='all'?' on':'')+'" data-chip="'+id+'">'+label+' <b>'+n+'</b></button>'; }
function renderFeeRows(){
  var q=(document.getElementById('fo-search')||{}).value; q=(q||'').toLowerCase().trim();
  var f=window._foFilter||'all';
  var list=_feeSummary.filter(function(r){ var st=feeStatus(r); if(f!=='all'&&st!==f) return false; if(q&&(r.full_name||'').toLowerCase().indexOf(q)<0&&(r.student_id||'').toLowerCase().indexOf(q)<0&&(r.class_name||'').toLowerCase().indexOf(q)<0) return false; return true; });
  var badge={paid:'<span class="badge b-green">'+t('paidInFull')+'</span>',partial:'<span class="badge b-gold">'+t('partial')+'</span>',unpaid:'<span class="badge b-red">'+t('unpaid')+'</span>',none:'<span class="badge b-gray">—</span>'};
  document.getElementById('foRows').innerHTML = list.length? list.map(function(r,i){ var st=feeStatus(r); return '<tr><td>'+(i+1)+'</td><td>'+esc(r.student_id)+'</td><td>'+esc(r.full_name)+'</td><td>'+esc((r.grade_level||'')+' / '+(r.class_name||''))+'</td><td>'+money(r.expected)+'</td><td>'+money(r.paid)+'</td><td>'+money(r.balance!=null?r.balance:(r.expected-r.paid))+'</td><td>'+(badge[st]||'')+'</td></tr>'; }).join('') : '<tr><td colspan="8">'+emptyBox()+'</td></tr>';
}
function csvDownload(name,head,rows){
  var csv='\ufeff'+[head].concat(rows).map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function exportFeesCsv(){ csvDownload('student-fees.csv',[t('studentId'),t('name'),t('grade'),t('className'),t('expected'),t('paid'),t('balance'),t('status')], _feeSummary.map(function(r){return [r.student_id,r.full_name,r.grade_level,r.class_name,r.expected,r.paid,(r.balance!=null?r.balance:(r.expected-r.paid)),feeStatus(r)];})); }
function exportLedgerCsv(){ csvDownload('payment-ledger.csv',[t('receipt'),t('date'),t('studentId'),t('name'),t('grade'),t('className'),t('academicYear'),t('term'),t('amountField'),t('method')], _feePayments.map(function(p){return [p.receipt_number,p.paid_at,p.student_id,p.full_name,p.grade_level,p.class_name,p.academic_year,p.term,p.amount,p.method];})); }
async function delPaymentFO(id){ if(!confirm(t('confirmDeletePayment'))) return; try{ await api('delete-payment',{method:'DELETE',body:{id:id}}); loadFeesOverview(); }catch(e){ alert('❌ '+e.message); } }

/* ============ INSTALL (desktop app) ============ */
var deferredPrompt=null, isApp=false;
function appMode(){ try{ return window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: window-controls-overlay)').matches || window.navigator.standalone===true; }catch(e){ return false; } }
function installedHere(){ try{ return localStorage.getItem('nurrAppInstalled')==='1'; }catch(e){ return false; } }
function setInstalled(v){ try{ v?localStorage.setItem('nurrAppInstalled','1'):localStorage.removeItem('nurrAppInstalled'); }catch(e){} }
if(appMode()){ isApp=true; setInstalled(true); document.title='NURR'; }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(function(){}); }
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferredPrompt=e; setInstalled(false); updateInstallBar(); });
window.addEventListener('appinstalled',function(){ setInstalled(true); updateInstallBar(); });
function updateInstallBar(){
  var bar=document.getElementById('installBar'); if(!bar) return;
  var loggedIn=document.getElementById('app').style.display==='block';
  var supported='BeforeInstallPromptEvent' in window || !!deferredPrompt;
  var desktop=false; try{ desktop=window.matchMedia('(pointer:fine)').matches && window.innerWidth>860; }catch(e){}
  var hidden=false; try{ hidden=sessionStorage.getItem('nurrBarHidden')==='1'; }catch(e){}
  bar.style.display=(loggedIn && supported && desktop && !hidden && !appMode() && !installedHere())?'':'none';
}
function hideInstallBar(){ try{ sessionStorage.setItem('nurrBarHidden','1'); }catch(e){} updateInstallBar(); }
async function installApp(){
  if(deferredPrompt){ deferredPrompt.prompt(); try{ var c=await deferredPrompt.userChoice; if(c&&c.outcome==='accepted') setInstalled(true); }catch(e){} deferredPrompt=null; updateInstallBar(); }
  else alert('To install: click the install icon at the right of the address bar, or open the browser menu and choose "Install NURR".');
}
setInterval(updateInstallBar,3000); window.addEventListener('resize',updateInstallBar);

/* ============ BOOT ============ */
applyLang();
if(tok()){ showApp(); } else { setTimeout(function(){ document.getElementById('lu').focus(); },150); }
</script>
