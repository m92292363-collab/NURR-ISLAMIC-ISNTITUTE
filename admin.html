<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NURR · Admin</title>
<link rel="icon" href="favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d3b6e">
<link rel="apple-touch-icon" href="/app-icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1e6fd9; --blue-dark:#0d3b6e; --blue-soft:#e8f2fe; --blue-mid:#cfe3fa;
  --ink:#14314f; --soft:#5f7a99; --line:#d9e6f5;
  --bg:#eef5fe; --card:#ffffff; --ok:#1e9e5a; --bad:#d64545; --warn:#c9820a; --gold:#e0a800;
  --sidebar:#0d3b6e; --sidebar-2:#15529a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
html[lang="ar"]{font-size:18px}
body.rtl{direction:rtl;font-family:'Nunito','Noto Sans Arabic','Cairo',sans-serif;font-size:1rem;line-height:1.7}
body.rtl h1,body.rtl h2,body.rtl h3,body.rtl .sb-item,body.rtl label,body.rtl th{font-weight:700}
body.rtl td,body.rtl th,body.rtl .sb-item,body.rtl label,body.rtl select,body.rtl input{font-weight:700;letter-spacing:0}
body.rtl table{font-size:0.98rem}
a{color:var(--blue)}
input,select,textarea,button{font-family:inherit}
input,select,textarea{width:100%;padding:0.6rem 0.75rem;border:1.5px solid var(--line);border-radius:10px;background:#fbfdff;color:var(--ink);outline:none;font-size:0.92rem}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,111,217,.12)}
label{display:block;font-size:0.8rem;font-weight:700;color:var(--soft);margin:0 0 0.3rem}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:0.6rem 1.1rem;font-weight:800;font-size:0.9rem;cursor:pointer;transition:.15s}
.btn:hover{background:#1a5fba}
.btn.sm{padding:0.4rem 0.8rem;font-size:0.82rem}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--blue-dark)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.bad{background:#fbeaea;color:var(--bad);border:1.5px solid #f3cccc}
.msg{border-radius:10px;padding:0.55rem 0.8rem;font-size:0.86rem;margin-top:0.6rem;display:none}
.msg.show{display:block}
.msg.ok{background:#e7f7ee;color:#157347;border:1px solid #b6e3c8}
.msg.err{background:#fdeaea;color:#b02a2a;border:1px solid #f1c4c4}

/* LOGIN */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;
  background:linear-gradient(150deg,#eaf3ff 0%,#dcebfd 0%,#dbeafe 60%,#eaf3ff 100%)}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2.2rem 2rem;width:100%;max-width:390px;text-align:center;box-shadow:0 18px 50px rgba(13,59,110,.14)}
.login-card .logo{width:72px;height:72px;border-radius:18px;object-fit:contain;background:var(--blue-soft);padding:8px}
.login-card h1{font-size:1.25rem;margin:0.7rem 0 0.2rem;color:var(--blue-dark)}
.login-card p{color:var(--soft);font-size:0.85rem;margin-bottom:1.3rem}
.login-card label{text-align:start;margin-top:0.8rem}

/* APP LAYOUT */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));color:#dbe9fb;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.sb-brand{display:flex;align-items:center;gap:0.6rem;padding:1rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.12)}
.sb-brand img{width:38px;height:38px;border-radius:10px;background:#fff;padding:3px;object-fit:contain}
.sb-brand b{font-size:1rem;color:#fff;line-height:1.1}
.sb-brand span{font-size:0.72rem;color:#9fc0ea}
.sb-scroll{flex:1;overflow-y:auto;padding:0.6rem 0.5rem}
.sb-group{font-size:0.68rem;text-transform:uppercase;letter-spacing:.06em;color:#7ba3d6;padding:0.8rem 0.7rem 0.3rem;font-weight:800}
.sb-item{display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0.75rem;border-radius:10px;color:#cfe0f7;cursor:pointer;font-weight:700;font-size:0.95rem;margin-bottom:2px}
.sb-item i{width:18px;text-align:center;font-size:0.95rem}
.sb-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sb-item.on{background:#fff;color:var(--blue-dark)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0.7rem 1.2rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:20}
.topbar h2{font-size:1.1rem;color:var(--blue-dark);flex:1;display:flex;align-items:center;gap:0.5rem}
.lang-toggle{position:relative;width:80px;height:34px;border-radius:999px;background:#c7c7cc;cursor:pointer;direction:ltr;flex:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .25s ease;outline:none}
.lang-toggle.ar{background:#34c759}
.lang-toggle:focus-visible{box-shadow:0 0 0 3px rgba(10,132,255,.45)}
.lang-toggle .lt-knob{position:absolute;top:3px;left:3px;width:36px;height:28px;border-radius:999px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.28);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:1}
.lang-toggle.ar .lt-knob{transform:translateX(38px)}
.lang-toggle span{position:absolute;top:0;width:40px;height:34px;line-height:34px;text-align:center;font-size:.8rem;font-weight:800;color:#fff;z-index:2;transition:color .2s}
.lang-toggle .lt-en{left:0}.lang-toggle .lt-ar{left:40px;font-family:'Noto Sans Arabic','Nunito',sans-serif;font-size:.82rem}
.lang-toggle:not(.ar) .lt-en,.lang-toggle.ar .lt-ar{color:#1c1c1e}
.content{padding:1.2rem;max-width:1180px;width:100%;margin:0 auto}
.page{display:none;animation:fade .2s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.2rem;margin-bottom:1.1rem;box-shadow:0 2px 10px rgba(13,59,110,.04)}
.card h3{font-size:1rem;color:var(--blue-dark);margin-bottom:0.9rem;display:flex;align-items:center;gap:0.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0.8rem}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0.9rem;margin-bottom:1.1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 2px 10px rgba(13,59,110,.05);position:relative;overflow:hidden}
.stat .ico{position:absolute;inset-inline-end:0.8rem;top:0.8rem;width:38px;height:38px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.stat .n{font-size:1.9rem;font-weight:800;color:var(--blue-dark)}
.stat .l{color:var(--soft);font-size:0.82rem;font-weight:700}
.stat.green .ico{background:#e4f6ec;color:var(--ok)} .stat.gold .ico{background:#fdf3d8;color:var(--gold)} .stat.red .ico{background:#fbe9e9;color:var(--bad)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:0.95rem}
th,td{padding:0.6rem 0.75rem;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink)}
tbody td{font-weight:600}
th{background:var(--blue-soft);color:var(--blue-dark);font-size:0.74rem;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
tr:hover td{background:#f6faff}
.badge{display:inline-block;padding:0.12rem 0.55rem;border-radius:999px;font-size:0.72rem;font-weight:800}
.b-green{background:#e4f6ec;color:#157347}.b-red{background:#fbe9e9;color:#b02a2a}.b-gray{background:#eef2f7;color:#5f7a99}.b-gold{background:#fdf3d8;color:#9a7700}
.empty{text-align:center;color:var(--soft);padding:2rem 1rem}
.empty i{font-size:1.8rem;color:var(--blue-mid);display:block;margin-bottom:0.5rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.row-actions{display:flex;gap:0.3rem;flex-wrap:wrap}
.filters{display:flex;gap:0.6rem;flex-wrap:wrap;align-items:end;margin-bottom:0.9rem}
.filters>div{flex:1;min-width:130px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,#eef3f9,#dde8f4,#eef3f9);background-size:200% 100%;animation:sh 1.2s infinite;margin:0.5rem 0}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

.install-bar{display:flex;align-items:center;gap:1rem;margin:0 0 1.1rem;padding:0.9rem 1.1rem;background:#fff;border:1.5px solid var(--blue-mid);border-radius:14px;box-shadow:0 4px 16px rgba(13,59,110,.06)}
.install-bar img{width:46px;height:46px;border-radius:11px;flex-shrink:0}
.install-bar .ib-t{flex:1;min-width:0}.install-bar .ib-t b{display:block;color:var(--blue-dark);font-size:0.95rem}.install-bar .ib-t span{color:var(--soft);font-size:0.82rem}
.install-bar .ib-x{background:none;border:0;color:#9db2c9;font-size:1.3rem;cursor:pointer;padding:0.2rem 0.4rem;line-height:1}
@media(max-width:860px){.install-bar{display:none!important}}
.theme-dot{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.2)}.theme-dot.on{border-color:#111;transform:scale(1.1)}
body.dark{--bg:#0f1826;--card:#17222f;--ink:#e6edf5;--soft:#9fb2c8;--line:#2a3a4d;--navy:#0b1420}
body.dark .topbar,body.dark .card,body.dark table,body.dark input,body.dark select,body.dark textarea{background:var(--card);color:var(--ink)}
body.dark input,body.dark select,body.dark textarea{border-color:var(--line)}
body.dark th{background:#1d2a39;color:var(--ink)}
body.eye{filter:sepia(0.18) brightness(0.97)}
.fo-chip{border:1.5px solid var(--line);background:#fff;color:var(--soft);padding:0.35rem 0.8rem;border-radius:999px;font-weight:700;font-size:0.82rem;cursor:pointer}.fo-chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}.fo-chip b{font-weight:800}
/* mobile sidebar */
.menu-btn{display:none;background:none;border:0;font-size:1.3rem;color:var(--blue-dark);cursor:pointer}
.backdrop{display:none;position:fixed;inset:0;background:rgba(13,42,74,.45);z-index:40}
@media(max-width:860px){
  .sidebar{position:fixed;inset-inline-start:0;top:0;z-index:50;transform:translateX(-100%);transition:.25s}
  body.rtl .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:none}
  .menu-btn{display:block}
  .backdrop.show{display:block}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <img src="nurry.png" class="logo" alt="" onerror="this.style.display='none'">
    <h1 data-t="brand">Nurr Islamic Institute</h1>
    <p data-t="adminPanel">Administration Panel</p>
    <label data-t="username">Username</label>
    <input type="text" id="lu" autocomplete="username" autocapitalize="none">
    <label data-t="password">Password</label>
    <input type="password" id="lp" autocomplete="current-password">
    <button class="btn" style="width:100%;margin-top:1.1rem" id="loginBtn" onclick="doLogin()"><i class="fas fa-right-to-bracket"></i> <span data-t="login">Log in</span></button>
    <div class="msg err" id="loginErr"></div>
    <div style="margin-top:1rem"><button class="lang-flip" onclick="toggleLang()" style="background:none;border:0;color:var(--blue);font-weight:800;cursor:pointer" id="langFlipLogin">عربي</button></div>
  </div>
</div>

<!-- APP -->
<div id="app">
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><img src="nurry.png" alt="" onerror="this.style.display='none'"><div><b data-t="nurr">NURR</b><br><span data-t="adminPanel">Admin Panel</span></div></div>
    <div class="sb-scroll" id="sbNav"></div>
  </aside>
  <div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="openSidebar()"><i class="fas fa-bars"></i></button>
      <h2><i class="fas fa-gauge-high"></i> <span id="pageTitle">Dashboard</span></h2>
      <div class="lang-toggle" id="langSw" role="switch" tabindex="0" aria-label="Language / اللغة" aria-checked="false" onclick="toggleLang()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleLang();}"><i class="lt-knob"></i><span class="lt-en">EN</span><span class="lt-ar">عربي</span></div>
      <button class="btn ghost sm" onclick="logout()"><i class="fas fa-right-from-bracket"></i> <span data-t="logout">Log out</span></button>
    </div>
    <div class="content"><div class="install-bar" id="installBar" style="display:none">
      <img src="/app-icons/icon-192.png" alt="NURR">
      <div class="ib-t"><b data-t="installTitle">Install NURR on this computer</b><span data-t="installSub">Open the admin from your desktop in one click — no browser tabs.</span></div>
      <button class="btn" onclick="installApp()"><i class="fas fa-download"></i> <span data-t="installBtn">Install NURR</span></button>
      <button class="ib-x" onclick="hideInstallBar()" title="Hide">&times;</button>
    </div><div id="content"></div></div>
  </div>
</div>
</div>

function t(k){ return (T[lang] && T[lang][k]) || (T.en[k]) || k; }
function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  document.body.classList.toggle('rtl', lang==='ar');
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t(el.getAttribute('data-t')); });
  var sw=document.getElementById('langSw'); if(sw){ sw.classList.toggle('ar', lang==='ar'); sw.setAttribute('aria-checked', lang==='ar'?'true':'false'); }
  var fl=document.getElementById('langFlipLogin'); if(fl) fl.textContent = lang==='en'?'عربي':'English';
  buildNav();
  if(document.getElementById('app').style.display==='block') openPage(currentPage,true);
}
function setLang(l){ lang=l; localStorage.setItem('nurr_lang',l); applyLang(); }
function toggleLang(){ setLang(lang==='en'?'ar':'en'); }

/* ============ API ============ */
var API='/api/';
function tok(){ return sessionStorage.getItem('nurr_token'); }
async function api(action, opts){
  opts=opts||{};
  var qs = opts.params ? ('?'+new URLSearchParams(Object.keys(opts.params).reduce(function(o,k){ if(opts.params[k]!=null&&opts.params[k]!=='') o[k]=opts.params[k]; return o;},{}))) : '';
  var init={ method:opts.method||'GET', headers:{} };
  if(tok()) init.headers['Authorization']='Bearer '+tok();
  if(opts.body){ init.headers['Content-Type']='application/json'; init.body=JSON.stringify(opts.body); }
  var res=await fetch(API+action+qs, init);
  if(res.status===401 && action!=='admin-login'){ sessionStorage.clear(); alert(t('sessionExpired')); location.reload(); throw new Error('401'); }
  var data; try{ data=await res.json(); }catch(e){ throw new Error('bad response'); }
  if(!data.success) throw new Error(data.error||'error');
  return data;
}

/* ============ LOGIN ============ */
async function doLogin(){
  var u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value, e=document.getElementById('loginErr');
  e.classList.remove('show');
  if(!u||!p){ e.textContent='…'; e.classList.add('show'); return; }
  var btn=document.getElementById('loginBtn'); btn.disabled=true;
  try{
    var d=await api('admin-login',{method:'POST',body:{username:u,password:p}});
    sessionStorage.setItem('nurr_token',d.token);
    sessionStorage.setItem('nurr_user',d.displayName||d.username);
    showApp();
  }catch(err){ e.textContent=err.message; e.classList.add('show'); }
  btn.disabled=false;
}
document.getElementById('lp').addEventListener('keydown',function(ev){ if(ev.key==='Enter') doLogin(); });
document.getElementById('lu').addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); document.getElementById('lp').focus(); } });
function logout(){ sessionStorage.clear(); location.reload(); }

/* ---- Dashboard ---- */
async function pageDashboard(c){
  c.innerHTML='<div class="stat-cards" id="sc"></div><div class="card"><h3><i class="fas fa-chart-pie"></i> '+t(dashboard())+'</h3><div id="byGrade">'+skeleton(3)+'</div></div>';
  try{
    var sres=await api('get-all-students');
    var rres=await api('get-all-results');
    var students=sres.students||[], results=rres.results||[];
    var active=students.filter(function(s){return s.active!==false && s.status!=='archived';});
    var classes={}; active.forEach(function(s){ classes[(s.grade_level||'')+'|'+(s.class_name||'')]=1; });
    var scores=results.map(function(r){return Number(r.score);}).filter(function(n){return !isNaN(n);});
    var avg=scores.length?Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length):0;
    document.getElementById('sc').innerHTML=
      statCard(active.length,'totalStudents','fa-user-graduate','')+
      statCard(results.length,'totalResults','fa-table-list','green')+
      statCard(Object.keys(classes).length,'classes','fa-layer-group','gold')+
      statCard(avg+'%','avgScore','fa-chart-line','red');
    var byG={}; active.forEach(function(s){ var g=s.grade_level||'—'; byG[g]=(byG[g]||0)+1; });
    var keys=Object.keys(byG).sort();
    document.getElementById('byGrade').innerHTML = keys.length? '<div class="tbl-wrap"><table><thead><tr><th>'+t('grade')+'</th><th>'+t('totalStudents')+'</th></tr></thead><tbody>'+keys.map(function(g){return '<tr><td>'+esc(g)+'</td><td>'+byG[g]+'</td></tr>';}).join('')+'</tbody></table></div>' : emptyBox();
  }catch(e){ c.innerHTML=errBox('dashboard'); }

      var rec=ad.record||{};
      if(!list.length){ body.innerHTML=emptyBox(); return; }
      var P=0,Ab=0; list.forEach(function(s){ var st=rec[s.student_id]; if(st && st!=='absent') P++; else if(st==='absent') Ab++; });
      body.innerHTML='<div class="stat-cards"><div class="stat green"><div class="n">'+P+'</div><div class="l">'+t('present')+'</div></div><div class="stat red"><div class="n">'+Ab+'</div><div class="l">'+t('absent')+'</div></div></div>'+
      '<div class="tbl-wrap"><table><thead><tr><th>'+t('studentId')+'</th><th>'+t('name')+'</th><th>'+t('status')+'</th></tr></thead><tbody>'+
        list.map(function(s){ var st=rec[s.student_id]; var badge = st==='absent'?'<span class="badge b-red">'+t('absent')+'</span>':(st?'<span class="badge b-green">'+t('present')+'</span>':'<span class="badge b-gray">—</span>');
          return '<tr><td>'+esc(s.student_id)+'</td><td>'+esc(s.full_name)+'</td><td>'+badge+'</td></tr>'; }).join('')+'</tbody></table></div>';
    }catch(e){ body.innerHTML=errBox('attendance','loadAtt'); }
  };

var _subjects=null, _subjectStages=null;
async function loadSubjectsData(force){ if(_subjects&&!force) return _subjects; try{ var d=await api('get-subjects'); _subjects=d.subjects||[]; }catch(e){ _subjects=_subjects||[]; } return _subjects; }

function subjectsForStage(stage){ if(!stage) return []; var tagged=(_subjectStages||[]).filter(function(m){return m.stage===stage;}).map(function(m){return m.subject;}); if(!tagged.length) return (_subjectStages&&_subjectStages.length)?[]:(_subjects||[]).slice(); return (_subjects||[]).filter(function(n){ return tagged.indexOf(n)>=0; }); }

/* ---- shared: classes + years dropdowns (from live DB) ---- */
var _classes=null, _years=null;
async function loadClassesData(force){ if(_classes&&!force) return _classes; try{ var d=await api('get-classes'); _classes=d.classes||[]; }catch(e){ _classes=_classes||[]; } return _classes; }
async function loadYears(force){ if(_years&&!force) return _years; try{ var d=await api('get-years'); _years=d.years||[]; }catch(e){ _years=_years||[]; } if(!_years.length){ var y=new Date().getFullYear(); _years=[y+'-'+(y+1)]; } return _years; }
function stageList(){ var st={}; (_classes||[]).forEach(function(c){ if(c.stage) st[c.stage]=1; }); return Object.keys(st); }
function classesForStage(stage){ return (_classes||[]).filter(function(c){ return String(c.stage)===String(stage); }); }
function fillStageSelect(id,withAll){ var sel=document.getElementById(id); if(!sel)return; sel.innerHTML=(withAll?'<option value="">'+t('allStages')+'</option>':'<option value="">'+t('selectStage')+'</option>')+stageList().map(function(g){return '<option>'+esc(g)+'</option>';}).join(''); }
function fillClassSelect(id,stage){ var sel=document.getElementById(id); if(!sel)return;
  if(stage){ var cs=classesForStage(stage); sel.innerHTML='<option value="">'+t('selectClass')+'</option>'+cs.map(function(c){return '<option>'+esc(c.name)+'</option>';}).join(''); return; }
  // no stage -> group all classes by stage with optgroup
  var html='<option value="">'+t('selectClass')+'</option>';
  stageList().forEach(function(g){ html+='<optgroup label="'+esc(g)+'">'+classesForStage(g).map(function(c){return '<option>'+esc(c.name)+'</option>';}).join('')+'</optgroup>'; });
  sel.innerHTML=html;
}
function fillYearSelect(id,value){ var sel=document.getElementById(id); if(!sel)return; var cur=value||sel.value;
  var years=(_years||[]).slice();
  if(cur&&years.indexOf(cur)<0) years.unshift(cur);
  sel.innerHTML=years.map(function(y){return '<option'+(y===cur?' selected':'')+'>'+esc(y)+'</option>';}).join('')+'<option value="__add__">+ '+t('addYear')+'</option>';
  sel.onchange=function(){ if(this.value==='__add__'){ var v=prompt(t('enterYear')||'Enter academic year (e.g. 2027-2028):',''); if(v&&/^\d{4}-\d{4}$/.test(v.trim())){ v=v.trim(); if((_years||[]).indexOf(v)<0) _years.unshift(v); fillYearSelect(id,v); } else { this.value=(_years&&_years[0])||''; if(v)alert(t('yearFormat')||'Use format 2027-2028'); } if(typeof sel._userOnchange==='function') sel._userOnchange(); } else { if(typeof sel._userOnchange==='function') sel._userOnchange(); } };
}

// ===== Amount in Arabic words (Dalasi) =====
function numToArabicWords(n){
  n=Math.round(Number(n)||0);
  if(n===0) return 'صفر';
  var ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  var tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  var hundreds=['','مائة','مئتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  function below1000(x){ var parts=[]; var h=Math.floor(x/100); var r=x%100; if(h) parts.push(hundreds[h]); if(r){ if(r<20) parts.push(ones[r]); else { var t=Math.floor(r/10),o=r%10; if(o) parts.push(ones[o]+' و'+tens[t]); else parts.push(tens[t]); } } return parts.join(' و'); }
  var parts=[];
  var billions=Math.floor(n/1000000000); n%=1000000000;
  var millions=Math.floor(n/1000000); n%=1000000;
  var thousands=Math.floor(n/1000); var rest=n%1000;
  if(billions) parts.push(below1000(billions)+' مليار');
  if(millions) parts.push(below1000(millions)+' مليون');
  if(thousands){ if(thousands===1) parts.push('ألف'); else if(thousands===2) parts.push('ألفان'); else if(thousands<11) parts.push(below1000(thousands)+' آلاف'); else parts.push(below1000(thousands)+' ألف'); }
  if(rest) parts.push(below1000(rest));
  return parts.join(' و');
}

function waLinkMessage(link, username, until, pw){
  var I=function(x){ return '\u2066'+x+'\u2069'; }; /* keeps English values from scrambling the Arabic lines */
  var p=String(until||'').split('-'), mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var dAr=p.length===3?p[2]+'-'+p[1]+'-'+p[0]:until, dEn=p.length===3?p[2]+' '+mo[parseInt(p[1],10)-1]+' '+p[0]:until;
  var ar='*معهد النور الإسلامي*\nالسلام عليكم، هذا رابطك الشخصي لإدخال الدرجات وتسجيل الحضور.\n\n👤 اسم المستخدم:\n'+username+'\n'+(pw?'🔑 كلمة المرور:\n'+pw+'\n':'')+'📅 صالح حتى: '+I(dAr)+'\n⚠️ لا تشارك هذا الرابط مع أحد.';

  if(ar) parts.push(ar);
  if(en) parts.push('———\n'+en);

function sendAnnounce(){
  var ar=val('an-ar').trim(), en=val('an-en').trim();
  if(!ar && !en){ alert(t('writeMessage')); return; }
  if(!anChosen().length){ alert(t('pickRecipient')); return; }
  var msg=buildAnnounceText();
  // WhatsApp cannot be told to message many numbers by a website, but when a message is
  // shared to it you can tick as many contacts as you like and send once.
  try{ if(navigator.clipboard) navigator.clipboard.writeText(msg); }catch(e){}
  if(navigator.share){ navigator.share({text:msg}).catch(function(){}); return; }
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');

}

function gradeForScore(sc){ sc=Number(sc); if(isNaN(sc))return''; if(sc>=85)return'ممتاز'; if(sc>=75)return'جيد جداً'; if(sc>=65)return'جيد'; if(sc>=50)return'مقبول'; if(sc>=40)return'ضعيف'; return'راسب'; }
async function saveBulk(){
  hide('bl-ok','bl-err');

  if(btn)btn.disabled=false;
  show('bl-ok','✅ '+t('saved')+' ('+n+')');
}

var _feeRows=[], _feePayments=[], _feeTargets=[], _foFilter='all';
async function loadFeesOverview(){
  var year=val('fo-year'), body=document.getElementById('fo-body');
  body.innerHTML='<div class="card">'+skeleton()+'</div>';
  try{
    var pays=await api('get-all-fee-payments');
    var tg=await api('get-fee-targets').catch(function(){return {targets:[]};});
    _feePayments=(pays.payments||[]).filter(function(p){ return p.academic_year===year; });
    _feeTargets=tg.targets||[];
    // group payments per student, split institute vs exam by reference/period
    var byStu={};
    _feePayments.forEach(function(p){
      if(!byStu[p.student_id]) byStu[p.student_id]={student_id:p.student_id,full_name:p.full_name,grade_level:p.grade_level,class_name:p.class_name,institute:0,exam:0};
      var ref=(p.reference||p.period||'').toString();
      if(ref.indexOf('امتحان')>=0||ref.toLowerCase().indexOf('exam')>=0) byStu[p.student_id].exam+=Number(p.amount)||0;
      else byStu[p.student_id].institute+=Number(p.amount)||0;
    });
    // include ALL active students so non-payers show as "haven't paid"
    try{ if(!_allStudents.length){ var sd=await api('get-all-students'); _allStudents=sd.students||[]; }
      _allStudents.forEach(function(st){ if(st.active===false)return; if(!byStu[st.student_id]) byStu[st.student_id]={student_id:st.student_id,full_name:st.full_name,grade_level:st.grade_level,class_name:st.class_name,institute:0,exam:0}; });
    }catch(e){}
    _feeRows=Object.keys(byStu).map(function(k){return byStu[k];});
    renderFeesOverview(year);

      list.map(function(s,i){ var dt=s.created_at?new Date(s.created_at).toLocaleDateString('en-GB'):(s.enrolled_year||''); return '<tr><td>'+(i+1)+'</td><td>'+esc(s.student_id)+'</td><td><b>'+esc(s.full_name)+'</b></td><td>'+esc(s.grade_level||'')+'</td><td>'+esc(s.class_name||'')+'</td><td>'+esc(dt)+'</td></tr>'; }).join('')+'</tbody></table></div>' : emptyBox();
  }
  function apply(){ var stage=val('ni-grade'),cls=val('ni-class'),q=(document.getElementById('ni-search').value||'').toLowerCase().trim(); render(window._intakeAll.filter(function(s){ if(stage&&String(s.grade_level)!==String(stage))return false; if(cls&&(s.class_name||'')!==cls)return false; if(q&&(s.full_name||'').toLowerCase().indexOf(q)<0&&(s.student_id||'').toLowerCase().indexOf(q)<0)return false; return true; })); }
  document.getElementById('ni-grade').onchange=function(){ fillClassSelect('ni-class',this.value); apply(); };
  document.getElementById('ni-class').onchange=apply; document.getElementById('ni-search').oninput=apply;
  render(all);
}
function exportIntakeCsv(){ csvDownload('new-intake.csv',[t('studentId'),t('name'),t('stage'),t('className'),t('enrolled')], (window._intakeAll||[]).map(function(s){return [s.student_id,s.full_name,s.grade_level,s.class_name,s.created_at||s.enrolled_year||''];})); }

/* ======================= EXPORT DATA ======================= */
async function pageExport(c){
  c.innerHTML='<div class="card"><h3><i class="fas fa-download"></i> '+t('exportData')+'</h3>'+
    '<p style="color:var(--soft);font-size:0.9rem;margin-bottom:0.8rem">'+t('exportDataDesc')+'</p>'+
    '<div style="display:flex;gap:0.6rem;flex-wrap:wrap">'+
      '<button class="btn" onclick="exportAll(\'students\')"><i class="fas fa-users"></i> '+t('students')+'</button>'+
      '<button class="btn" onclick="exportAll(\'results\')"><i class="fas fa-table-list"></i> '+t('results')+'</button>'+
      '<button class="btn" onclick="exportAll(\'payments\')"><i class="fas fa-receipt"></i> '+t('payments')+'</button>'+
    '</div><div class="msg ok" id="ex-ok"></div><div class="msg err" id="ex-err"></div></div>';
}
async function exportAll(kind){
  hide('ex-ok','ex-err');
  try{
    if(kind==='students'){ var d=await api('get-all-students'); csvDownload('students.csv',[t('studentId'),t('name'),t('stage'),t('className'),t('guardian'),t('phone'),t('nationality')],(d.students||[]).map(function(s){return [s.student_id,s.full_name,s.grade_level,s.class_name,s.guardian_name,s.guardian_phone||s.student_phone,s.nationality];})); }
    else if(kind==='results'){ var d=await api('get-all-results'); csvDownload('results.csv',[t('studentId'),t('name'),t('stage'),t('className'),t('subject'),t('score'),t('gradeCol'),t('year'),t('term')],(d.results||[]).map(function(r){return [r.student_id,r.full_name,r.grade_level,r.class_name,r.subject,r.score,r.grade,r.academic_year,r.term];})); }
    else if(kind==='payments'){ var d=await api('get-all-fee-payments'); csvDownload('payments.csv',[t('receipt'),t('date'),t('studentId'),t('name'),t('className'),t('amountField'),t('method'),t('year')],(d.payments||[]).map(function(p){return [p.receipt_number,p.paid_at,p.student_id,p.full_name,p.class_name,p.amount,p.method,p.academic_year];})); }
    show('ex-ok','✅ '+t('exported'));
  }catch(e){ show('ex-err','❌ '+e.message); }
}

/* ======================= ATTENDANCE BOOK ======================= */
async function pageAttendanceBook(c){
  var now=new Date(); var ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  c.innerHTML='<div class="card"><h3><i class="fas fa-book"></i> '+t('attendanceBook')+'</h3>'+
    '<div class="filters">'+selField('ab-grade',t('stage'))+selField('ab-class',t('className'))+
      '<div><label>'+t('month')+'</label><input type="month" id="ab-month" value="'+ym+'"></div>'+
      '<div style="flex:0"><label>&nbsp;</label><button class="btn" onclick="loadAttendanceBook()"><i class="fas fa-eye"></i></button></div>'+
    '</div><div class="msg err" id="ab-err"></div><div id="ab-out"></div></div>';
  await loadClassesData(); fillStageSelect('ab-grade'); fillClassSelect('ab-class','');
  document.getElementById('ab-grade').onchange=function(){ fillClassSelect('ab-class',this.value); };
}
async function loadAttendanceBook(){
  hide('ab-err'); var g=val('ab-grade'),cls=val('ab-class'),ym=val('ab-month');
  if(!g||!cls||!ym){ show('ab-err',t('required')); return; }
  document.getElementById('ab-out').innerHTML=skeleton();
  var y=parseInt(ym.split('-')[0]), mo=parseInt(ym.split('-')[1]);
  var daysInMonth=new Date(y,mo,0).getDate();
  var from=ym+'-01', to=ym+'-'+String(daysInMonth).padStart(2,'0');
  try{ var d=await api('attendance-book',{params:{gradeLevel:g,className:cls,fromDate:from,toDate:to}});
    var students=d.students||[], marks=d.marks||{};
    if(!students.length){ document.getElementById('ab-out').innerHTML=emptyBox(); return; }
    // weekdays Mon-Fri columns
    var days=[]; for(var dd=1;dd<=daysInMonth;dd++){ var dt=new Date(y,mo-1,dd); var wd=dt.getDay(); if(wd>=1&&wd<=5) days.push(dd); }
    var head='<tr><th style="position:sticky;right:0;background:#eef2f7">#</th><th style="position:sticky;right:30px;background:#eef2f7">'+t('name')+'</th>'+days.map(function(dd){return '<th>'+dd+'</th>';}).join('')+'<th>%</th></tr>';
    var body=students.map(function(s,i){
      var present=0,total=0;
      var cells=days.map(function(dd){ var key=ym+'-'+String(dd).padStart(2,'0'); var st=(marks[s.student_id]||{})[key];
        if(st==='present'){present++;total++;return '<td style="background:#e6f7ec;color:#1e9e5a;font-weight:800">P</td>';}
        if(st==='absent'){total++;return '<td style="background:#fdeaea;color:#d64545;font-weight:800">A</td>';}
        return '<td style="color:#bbb">·</td>'; });
      var pct=total?Math.round(present/total*100):0;
      return '<tr><td style="position:sticky;right:0;background:#fff">'+(i+1)+'</td><td style="position:sticky;right:30px;background:#fff;text-align:right;white-space:nowrap"><b>'+esc(s.full_name)+'</b></td>'+cells.join('')+'<td><b>'+pct+'%</b></td></tr>';
    }).join('');
    document.getElementById('ab-out').innerHTML='<div style="text-align:center;margin:0.6rem 0"><button class="btn" onclick="printAttBook()"><i class="fas fa-print"></i> '+t('print')+'</button></div>'+
      '<div id="abSheet" style="background:#fff;padding:6mm;border:1px solid #000"><h3 style="text-align:center">NURR · '+t('attendanceBook')+' — '+esc(g)+' / '+esc(cls)+' · '+esc(ym)+'</h3><div class="tbl-wrap"><table class="ab-tbl">'+'<thead>'+head+'</thead><tbody>'+body+'</tbody></table></div><p style="font-size:0.8rem;margin-top:0.4rem">P = '+t('present')+' · A = '+t('absent')+' · · = '+t('notMarked')+'</p></div>';
    if(!document.getElementById('abStyle')){ var stl=document.createElement('style'); stl.id='abStyle'; stl.textContent='.ab-tbl{border-collapse:collapse;font-size:9pt}.ab-tbl th,.ab-tbl td{border:1px solid #999;padding:2px 5px;text-align:center;min-width:22px}'; document.head.appendChild(stl); }
  }catch(e){ show('ab-err','❌ '+e.message); }
}
function printAttBook(){ var sheet=document.getElementById('abSheet'); if(!sheet)return; var css=document.getElementById('abStyle').textContent; var win=window.open('','_blank'); if(!win)return; win.document.write('<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><style>'+css+'@page{size:A4 landscape;margin:8mm}h3{text-align:center}</style></head><body>'+sheet.innerHTML+'<'+'script>window.onload=function(){window.print()}<'+'/script></body></html>'); win.document.close(); }

/* ============ INSTALL (desktop app) ============ */
var deferredPrompt=null, isApp=false;
function appMode(){ try{ return window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: window-controls-overlay)').matches || window.navigator.standalone===true; }catch(e){ return false; } }
function installedHere(){ try{ return localStorage.getItem('nurrAppInstalled')==='1'; }catch(e){ return false; } }
function setInstalled(v){ try{ v?localStorage.setItem('nurrAppInstalled','1'):localStorage.removeItem('nurrAppInstalled'); }catch(e){} }
if(appMode()){ isApp=true; setInstalled(true); document.title='NURR'; }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(function(){}); }
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferredPrompt=e; setInstalled(false); updateInstallBar(); });
window.addEventListener('appinstalled',function(){ setInstalled(true); updateInstallBar(); });
function updateInstallBar(){
  var bar=document.getElementById('installBar'); if(!bar) return;
  var loggedIn=document.getElementById('app').style.display==='block';
  var supported='BeforeInstallPromptEvent' in window || !!deferredPrompt;
  var desktop=false; try{ desktop=window.matchMedia('(pointer:fine)').matches && window.innerWidth>860; }catch(e){}
  var hidden=false; try{ hidden=sessionStorage.getItem('nurrBarHidden')==='1'; }catch(e){}
  bar.style.display=(loggedIn && supported && desktop && !hidden && !appMode() && !installedHere())?'':'none';
}
function hideInstallBar(){ try{ sessionStorage.setItem('nurrBarHidden','1'); }catch(e){} updateInstallBar(); }
async function installApp(){
  if(deferredPrompt){ deferredPrompt.prompt(); try{ var c=await deferredPrompt.userChoice; if(c&&c.outcome==='accepted') setInstalled(true); }catch(e){} deferredPrompt=null; updateInstallBar(); }
  else alert('To install: click the install icon at the right of the address bar, or open the browser menu and choose "Install NURR".');
}
setInterval(updateInstallBar,3000); window.addEventListener('resize',updateInstallBar);

/* ============ BOOT ============ */
applyLang();
if(tok()){ showApp(); } else { setTimeout(function(){ document.getElementById('lu').focus(); },150); }
</script>
