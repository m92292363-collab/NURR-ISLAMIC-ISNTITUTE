<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NURR · Admin</title>
<link rel="icon" href="favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d3b6e">
<link rel="apple-touch-icon" href="/app-icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
:root{
  --blue:#1e6fd9; --blue-dark:#0d3b6e; --blue-soft:#e8f2fe; --blue-mid:#cfe3fa;
  --ink:#14314f; --soft:#5f7a99; --line:#d9e6f5;
  --bg:#eef5fe; --card:#ffffff; --ok:#1e9e5a; --bad:#d64545; --warn:#c9820a; --gold:#e0a800;
  --sidebar:#0d3b6e; --sidebar-2:#15529a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body.rtl{direction:rtl;font-family:'Amiri','Nunito',serif}
a{color:var(--blue)}
input,select,textarea,button{font-family:inherit}
input,select,textarea{width:100%;padding:0.6rem 0.75rem;border:1.5px solid var(--line);border-radius:10px;background:#fbfdff;color:var(--ink);outline:none;font-size:0.92rem}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,111,217,.12)}
label{display:block;font-size:0.8rem;font-weight:700;color:var(--soft);margin:0 0 0.3rem}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:0.6rem 1.1rem;font-weight:800;font-size:0.9rem;cursor:pointer;transition:.15s}
.btn:hover{background:#1a5fba}
.btn.sm{padding:0.4rem 0.8rem;font-size:0.82rem}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--blue-dark)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.bad{background:#fbeaea;color:var(--bad);border:1.5px solid #f3cccc}
.msg{border-radius:10px;padding:0.55rem 0.8rem;font-size:0.86rem;margin-top:0.6rem;display:none}
.msg.show{display:block}
.msg.ok{background:#e7f7ee;color:#157347;border:1px solid #b6e3c8}
.msg.err{background:#fdeaea;color:#b02a2a;border:1px solid #f1c4c4}

/* LOGIN */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;
  background:linear-gradient(150deg,#eaf3ff 0%,#dcebfd 0%,#dbeafe 60%,#eaf3ff 100%)}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2.2rem 2rem;width:100%;max-width:390px;text-align:center;box-shadow:0 18px 50px rgba(13,59,110,.14)}
.login-card .logo{width:72px;height:72px;border-radius:18px;object-fit:contain;background:var(--blue-soft);padding:8px}
.login-card h1{font-size:1.25rem;margin:0.7rem 0 0.2rem;color:var(--blue-dark)}
.login-card p{color:var(--soft);font-size:0.85rem;margin-bottom:1.3rem}
.login-card label{text-align:start;margin-top:0.8rem}

/* APP LAYOUT */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));color:#dbe9fb;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.sb-brand{display:flex;align-items:center;gap:0.6rem;padding:1rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.12)}
.sb-brand img{width:38px;height:38px;border-radius:10px;background:#fff;padding:3px;object-fit:contain}
.sb-brand b{font-size:1rem;color:#fff;line-height:1.1}
.sb-brand span{font-size:0.72rem;color:#9fc0ea}
.sb-scroll{flex:1;overflow-y:auto;padding:0.6rem 0.5rem}
.sb-group{font-size:0.68rem;text-transform:uppercase;letter-spacing:.06em;color:#7ba3d6;padding:0.8rem 0.7rem 0.3rem;font-weight:800}
.sb-item{display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0.75rem;border-radius:10px;color:#cfe0f7;cursor:pointer;font-weight:700;font-size:0.9rem;margin-bottom:2px}
.sb-item i{width:18px;text-align:center;font-size:0.95rem}
.sb-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sb-item.on{background:#fff;color:var(--blue-dark)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0.7rem 1.2rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:20}
.topbar h2{font-size:1.1rem;color:var(--blue-dark);flex:1;display:flex;align-items:center;gap:0.5rem}
.lang-toggle{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang-toggle button{border:0;background:#fff;color:var(--soft);padding:0.3rem 0.8rem;font-weight:800;font-size:0.8rem;cursor:pointer}
.lang-toggle button.on{background:var(--blue);color:#fff}
.content{padding:1.2rem;max-width:1180px;width:100%;margin:0 auto}
.page{display:none;animation:fade .2s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.2rem;margin-bottom:1.1rem;box-shadow:0 2px 10px rgba(13,59,110,.04)}
.card h3{font-size:1rem;color:var(--blue-dark);margin-bottom:0.9rem;display:flex;align-items:center;gap:0.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0.8rem}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0.9rem;margin-bottom:1.1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 2px 10px rgba(13,59,110,.05);position:relative;overflow:hidden}
.stat .ico{position:absolute;inset-inline-end:0.8rem;top:0.8rem;width:38px;height:38px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.stat .n{font-size:1.9rem;font-weight:800;color:var(--blue-dark)}
.stat .l{color:var(--soft);font-size:0.82rem;font-weight:700}
.stat.green .ico{background:#e4f6ec;color:var(--ok)} .stat.gold .ico{background:#fdf3d8;color:var(--gold)} .stat.red .ico{background:#fbe9e9;color:var(--bad)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:0.86rem}
th,td{padding:0.55rem 0.7rem;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--blue-soft);color:var(--blue-dark);font-size:0.74rem;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
tr:hover td{background:#f6faff}
.badge{display:inline-block;padding:0.12rem 0.55rem;border-radius:999px;font-size:0.72rem;font-weight:800}
.b-green{background:#e4f6ec;color:#157347}.b-red{background:#fbe9e9;color:#b02a2a}.b-gray{background:#eef2f7;color:#5f7a99}.b-gold{background:#fdf3d8;color:#9a7700}
.empty{text-align:center;color:var(--soft);padding:2rem 1rem}
.empty i{font-size:1.8rem;color:var(--blue-mid);display:block;margin-bottom:0.5rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.row-actions{display:flex;gap:0.3rem;flex-wrap:wrap}
.filters{display:flex;gap:0.6rem;flex-wrap:wrap;align-items:end;margin-bottom:0.9rem}
.filters>div{flex:1;min-width:130px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,#eef3f9,#dde8f4,#eef3f9);background-size:200% 100%;animation:sh 1.2s infinite;margin:0.5rem 0}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

.install-bar{display:flex;align-items:center;gap:1rem;margin:0 0 1.1rem;padding:0.9rem 1.1rem;background:#fff;border:1.5px solid var(--blue-mid);border-radius:14px;box-shadow:0 4px 16px rgba(13,59,110,.06)}
.install-bar img{width:46px;height:46px;border-radius:11px;flex-shrink:0}
.install-bar .ib-t{flex:1;min-width:0}.install-bar .ib-t b{display:block;color:var(--blue-dark);font-size:0.95rem}.install-bar .ib-t span{color:var(--soft);font-size:0.82rem}
.install-bar .ib-x{background:none;border:0;color:#9db2c9;font-size:1.3rem;cursor:pointer;padding:0.2rem 0.4rem;line-height:1}
@media(max-width:860px){.install-bar{display:none!important}}
/* mobile sidebar */
.menu-btn{display:none;background:none;border:0;font-size:1.3rem;color:var(--blue-dark);cursor:pointer}
.backdrop{display:none;position:fixed;inset:0;background:rgba(13,42,74,.45);z-index:40}
@media(max-width:860px){
  .sidebar{position:fixed;inset-inline-start:0;top:0;z-index:50;transform:translateX(-100%);transition:.25s}
  body.rtl .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:none}
  .menu-btn{display:block}
  .backdrop.show{display:block}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <img src="nurry.png" class="logo" alt="" onerror="this.style.display='none'">
    <h1 data-t="brand">Nurr Islamic Institute</h1>
    <p data-t="adminPanel">Administration Panel</p>
    <label data-t="username">Username</label>
    <input type="text" id="lu" autocomplete="username" autocapitalize="none">
    <label data-t="password">Password</label>
    <input type="password" id="lp" autocomplete="current-password">
    <button class="btn" style="width:100%;margin-top:1.1rem" id="loginBtn" onclick="doLogin()"><i class="fas fa-right-to-bracket"></i> <span data-t="login">Log in</span></button>
    <div class="msg err" id="loginErr"></div>
    <div style="margin-top:1rem"><button class="lang-flip" onclick="toggleLang()" style="background:none;border:0;color:var(--blue);font-weight:800;cursor:pointer" id="langFlipLogin">عربي</button></div>
  </div>
</div>

<!-- APP -->
<div id="app">
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><img src="nurry.png" alt="" onerror="this.style.display='none'"><div><b data-t="nurr">NURR</b><br><span data-t="adminPanel">Admin Panel</span></div></div>
    <div class="sb-scroll" id="sbNav"></div>
  </aside>
  <div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="openSidebar()"><i class="fas fa-bars"></i></button>
      <h2><i class="fas fa-gauge-high"></i> <span id="pageTitle">Dashboard</span></h2>
      <div class="lang-toggle"><button id="enBtn" class="on" onclick="setLang('en')">EN</button><button id="arBtn" onclick="setLang('ar')">عربي</button></div>
      <button class="btn ghost sm" onclick="logout()"><i class="fas fa-right-from-bracket"></i> <span data-t="logout">Log out</span></button>
    </div>
    <div class="content"><div class="install-bar" id="installBar" style="display:none">
      <img src="/app-icons/icon-192.png" alt="NURR">
      <div class="ib-t"><b data-t="installTitle">Install NURR on this computer</b><span data-t="installSub">Open the admin from your desktop in one click — no browser tabs.</span></div>
      <button class="btn" onclick="installApp()"><i class="fas fa-download"></i> <span data-t="installBtn">Install NURR</span></button>
      <button class="ib-x" onclick="hideInstallBar()" title="Hide">&times;</button>
    </div><div id="content"></div></div>
  </div>
</div>
</div>

    guardianName:'اسم ولي الأمر', guardianPhone:'هاتف ولي الأمر', studentPhone:'هاتف الطالب', dob:'تاريخ الميلاد', address:'العنوان',
    selectGrade:'اختر المرحلة', selectClass:'اختر الفصل', selectStudent:'اختر الطالب', required:'يرجى ملء الحقول المطلوبة',

};
var lang = localStorage.getItem('nurr_lang') || 'en';
function t(k){ return (T[lang] && T[lang][k]) || (T.en[k]) || k; }
function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  document.body.classList.toggle('rtl', lang==='ar');
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t(el.getAttribute('data-t')); });
  document.getElementById('enBtn').classList.toggle('on', lang==='en');
  document.getElementById('arBtn').classList.toggle('on', lang==='ar');
  var fl=document.getElementById('langFlipLogin'); if(fl) fl.textContent = lang==='en'?'عربي':'English';
  buildNav();
  if(document.getElementById('app').style.display==='block') openPage(currentPage,true);
}
function setLang(l){ lang=l; localStorage.setItem('nurr_lang',l); applyLang(); }
function toggleLang(){ setLang(lang==='en'?'ar':'en'); }

/* ============ API ============ */
var API='/api/';
function tok(){ return sessionStorage.getItem('nurr_token'); }
async function api(action, opts){
  opts=opts||{};
  var qs = opts.params ? ('?'+new URLSearchParams(Object.keys(opts.params).reduce(function(o,k){ if(opts.params[k]!=null&&opts.params[k]!=='') o[k]=opts.params[k]; return o;},{}))) : '';
  var init={ method:opts.method||'GET', headers:{} };
  if(tok()) init.headers['Authorization']='Bearer '+tok();
  if(opts.body){ init.headers['Content-Type']='application/json'; init.body=JSON.stringify(opts.body); }
  var res=await fetch(API+action+qs, init);
  if(res.status===401 && action!=='admin-login'){ sessionStorage.clear(); alert(t('sessionExpired')); location.reload(); throw new Error('401'); }
  var data; try{ data=await res.json(); }catch(e){ throw new Error('bad response'); }
  if(!data.success) throw new Error(data.error||'error');
  return data;
}

/* ============ LOGIN ============ */
async function doLogin(){
  var u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value, e=document.getElementById('loginErr');
  e.classList.remove('show');
  if(!u||!p){ e.textContent='…'; e.classList.add('show'); return; }
  var btn=document.getElementById('loginBtn'); btn.disabled=true;
  try{
    var d=await api('admin-login',{method:'POST',body:{username:u,password:p}});
    sessionStorage.setItem('nurr_token',d.token);
    sessionStorage.setItem('nurr_user',d.displayName||d.username);
    showApp();
  }catch(err){ e.textContent=err.message; e.classList.add('show'); }
  btn.disabled=false;
}
document.getElementById('lp').addEventListener('keydown',function(ev){ if(ev.key==='Enter') doLogin(); });
document.getElementById('lu').addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); document.getElementById('lp').focus(); } });
function logout(){ sessionStorage.clear(); location.reload(); }

/* ============ NAV ============ */
var NAV=[

function skeleton(rows){ var s=''; for(var i=0;i<(rows||4);i++) s+='<div class="sk" style="width:'+(70+Math.random()*25)+'%"></div>'; return s; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function openPage(id, keep){

/* ---- Dashboard ---- */
async function pageDashboard(c){
  c.innerHTML='<div class="stat-cards" id="sc"></div><div class="card"><h3><i class="fas fa-chart-pie"></i> '+t(dashboard())+'</h3><div id="byGrade">'+skeleton(3)+'</div></div>';
  try{
    var sres=await api('get-all-students');
    var rres=await api('get-all-results');
    var students=sres.students||[], results=rres.results||[];
    var active=students.filter(function(s){return s.active!==false && s.status!=='archived';});
    var classes={}; active.forEach(function(s){ classes[(s.grade_level||'')+'|'+(s.class_name||'')]=1; });
    var scores=results.map(function(r){return Number(r.score);}).filter(function(n){return !isNaN(n);});
    var avg=scores.length?Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length):0;
    document.getElementById('sc').innerHTML=
      statCard(active.length,'totalStudents','fa-user-graduate','')+
      statCard(results.length,'totalResults','fa-table-list','green')+
      statCard(Object.keys(classes).length,'classes','fa-layer-group','gold')+
      statCard(avg+'%','avgScore','fa-chart-line','red');
    var byG={}; active.forEach(function(s){ var g=s.grade_level||'—'; byG[g]=(byG[g]||0)+1; });
    var keys=Object.keys(byG).sort();
    document.getElementById('byGrade').innerHTML = keys.length? '<div class="tbl-wrap"><table><thead><tr><th>'+t('grade')+'</th><th>'+t('totalStudents')+'</th></tr></thead><tbody>'+keys.map(function(g){return '<tr><td>'+esc(g)+'</td><td>'+byG[g]+'</td></tr>';}).join('')+'</tbody></table></div>' : emptyBox();
  }catch(e){ c.innerHTML=errBox('dashboard'); }
}
function dashboard(){ return 'dashboard'; }
function statCard(n,l,icon,cls){ return '<div class="stat '+(cls||'')+'"><div class="ico"><i class="fas '+icon+'"></i></div><div class="n">'+n+'</div><div class="l">'+t(l)+'</div></div>'; }

async function pageFees(c){

  c.innerHTML='<div class="card"><h3><i class="fas fa-sack-dollar"></i> '+t('fees')+'</h3>'+

    '<div id="fBody"><div class="empty"><i class="fas fa-sack-dollar"></i>'+t('pickFilters')+'</div></div></div>';
  window.loadFees=async function(){
    var body=document.getElementById('fBody'); body.innerHTML=skeleton();
    try{
      var d=await api('get-fee-summary',{params:{academicYear:document.getElementById('fYear').value.trim(), term:document.getElementById('fTerm').value}});
      var rows=d.summary||[];
      if(!rows.length){ body.innerHTML=emptyBox(); return; }
      var tE=0,tP=0; rows.forEach(function(r){ tE+=Number(r.expected)||0; tP+=Number(r.paid)||0; });
      body.innerHTML='<div class="stat-cards"><div class="stat"><div class="n">'+money(tE)+'</div><div class="l">'+t('expected')+'</div></div><div class="stat green"><div class="n">'+money(tP)+'</div><div class="l">'+t('paid')+'</div></div><div class="stat red"><div class="n">'+money(tE-tP)+'</div><div class="l">'+t('balance')+'</div></div></div>'+
      '<div class="tbl-wrap"><table><thead><tr><th>'+t('studentId')+'</th><th>'+t('name')+'</th><th>'+t('grade')+'</th><th>'+t('expected')+'</th><th>'+t('paid')+'</th><th>'+t('balance')+'</th></tr></thead><tbody>'+
        rows.map(function(r){
          var bal=Number(r.balance!=null?r.balance:(r.expected-r.paid))||0;
          var bc=bal<=0?'b-green':(Number(r.paid)>0?'b-gold':'b-red');
          return '<tr><td>'+esc(r.student_id)+'</td><td>'+esc(r.full_name)+'</td><td>'+esc(r.grade_level||'')+'</td><td>'+money(r.expected)+'</td><td>'+money(r.paid)+'</td><td><span class="badge '+bc+'">'+money(bal)+'</span></td></tr>';
        }).join('')+'</tbody></table></div>';
    }catch(e){ body.innerHTML=errBox('fees','loadFees'); }
  };
}
function money(n){ n=Number(n)||0; return 'D '+n.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2}); }

async function pageAttendance(c){

    if(!date||!grade||!cls){ body.innerHTML='<div class="empty"><i class="fas fa-circle-info"></i>'+t('pickFilters')+'</div>'; return; }
    body.innerHTML=skeleton();
    try{
      var sd=await api('get-all-students');
      var list=(sd.students||[]).filter(function(s){ return String(s.grade_level)===String(grade) && (s.class_name||'').toLowerCase()===cls.toLowerCase() && s.active!==false && s.status!=='archived'; });
      var ad=await api('get-attendance',{params:{date:date,gradeLevel:grade,className:cls}});
      var rec=ad.record||{};
      if(!list.length){ body.innerHTML=emptyBox(); return; }
      var P=0,Ab=0; list.forEach(function(s){ var st=rec[s.student_id]; if(st && st!=='absent') P++; else if(st==='absent') Ab++; });
      body.innerHTML='<div class="stat-cards"><div class="stat green"><div class="n">'+P+'</div><div class="l">'+t('present')+'</div></div><div class="stat red"><div class="n">'+Ab+'</div><div class="l">'+t('absent')+'</div></div></div>'+
      '<div class="tbl-wrap"><table><thead><tr><th>'+t('studentId')+'</th><th>'+t('name')+'</th><th>'+t('status')+'</th></tr></thead><tbody>'+
        list.map(function(s){ var st=rec[s.student_id]; var badge = st==='absent'?'<span class="badge b-red">'+t('absent')+'</span>':(st?'<span class="badge b-green">'+t('present')+'</span>':'<span class="badge b-gray">—</span>');
          return '<tr><td>'+esc(s.student_id)+'</td><td>'+esc(s.full_name)+'</td><td>'+badge+'</td></tr>'; }).join('')+'</tbody></table></div>';
    }catch(e){ body.innerHTML=errBox('attendance','loadAtt'); }
  };
}

/* ============ INSTALL (desktop app) ============ */
var deferredPrompt=null, isApp=false;
function appMode(){ try{ return window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: window-controls-overlay)').matches || window.navigator.standalone===true; }catch(e){ return false; } }
function installedHere(){ try{ return localStorage.getItem('nurrAppInstalled')==='1'; }catch(e){ return false; } }
function setInstalled(v){ try{ v?localStorage.setItem('nurrAppInstalled','1'):localStorage.removeItem('nurrAppInstalled'); }catch(e){} }
if(appMode()){ isApp=true; setInstalled(true); document.title='NURR'; }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(function(){}); }
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferredPrompt=e; setInstalled(false); updateInstallBar(); });
window.addEventListener('appinstalled',function(){ setInstalled(true); updateInstallBar(); });
function updateInstallBar(){
  var bar=document.getElementById('installBar'); if(!bar) return;
  var loggedIn=document.getElementById('app').style.display==='block';
  var supported='BeforeInstallPromptEvent' in window || !!deferredPrompt;
  var desktop=false; try{ desktop=window.matchMedia('(pointer:fine)').matches && window.innerWidth>860; }catch(e){}
  var hidden=false; try{ hidden=sessionStorage.getItem('nurrBarHidden')==='1'; }catch(e){}
  bar.style.display=(loggedIn && supported && desktop && !hidden && !appMode() && !installedHere())?'':'none';
}
function hideInstallBar(){ try{ sessionStorage.setItem('nurrBarHidden','1'); }catch(e){} updateInstallBar(); }
async function installApp(){
  if(deferredPrompt){ deferredPrompt.prompt(); try{ var c=await deferredPrompt.userChoice; if(c&&c.outcome==='accepted') setInstalled(true); }catch(e){} deferredPrompt=null; updateInstallBar(); }
  else alert('To install: click the install icon at the right of the address bar, or open the browser menu and choose "Install NURR".');
}
setInterval(updateInstallBar,3000); window.addEventListener('resize',updateInstallBar);

/* ============ BOOT ============ */
applyLang();
if(tok()){ showApp(); } else { setTimeout(function(){ document.getElementById('lu').focus(); },150); }
